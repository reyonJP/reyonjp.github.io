<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  /* ================= トークン ================= */
  :root{
    --bg:#0a0b0d;
    --bg-soft:#101115;
    --panel:#181a21;
    --panel-2:#1e2129;
    --panel-edge:#363b48;
    --hairline:#2c303b;
    --edge-hover:#3a3f4d;
    --ink:#ecebe5;
    --ink-dim:#9a988f;
    --ink-faint:#6c6a63;
    --ember:#ff8a3d;
    --ember-hot:#ffc857;
    --ember-deep:#d4581f;
    --win:143,191,107;        /* 勝利の緑（rgba() で透明度を変えて使う） */
    --team-a:#5b9bd5;
    --team-a-bg:rgba(91,155,213,.08);
    --team-b:#d95f5f;
    --team-b-bg:rgba(217,95,95,.08);
    --jp-font:'Noto Sans JP',sans-serif;
    --num-font:'Chakra Petch',monospace;
    --radius:2px;             /* 角張ったデザイン：箱類の角丸はすべてこの値 */
  }

  /* ================= ベース ================= */
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1100px 480px at 78% -8%,rgba(255,138,61,.10),transparent 60%),
      radial-gradient(900px 500px at -5% 0%,rgba(127,168,201,.06),transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--jp-font);
    font-size:16px;line-height:1.65;min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:var(--jp-font)}
  .wrap{max-width:85%;margin:0 auto;padding:28px 20px 72px}
  *::-webkit-scrollbar{height:10px;width:10px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:var(--panel-edge);border:2px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--edge-hover);background-clip:content-box}

  /* ================= ヘッダー ================= */
  header{position:relative;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--panel-edge);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand-mark{width:42px;height:42px;flex-shrink:0;border-radius:var(--radius);display:grid;place-items:center;font-size:21px;background:linear-gradient(145deg,#23262f,#15171c);border:1px solid var(--panel-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 22px -8px var(--ember)}
  h1{font-weight:900;font-size:29px;letter-spacing:.04em;line-height:1.2}
  .nav-links{display:flex;gap:8px;flex-shrink:0}
  .nav-link{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius);background:var(--ember);color:#15161a;font-size:15px;font-weight:700;text-decoration:none;transition:background .15s,transform .1s}
  .nav-link:hover{background:var(--ember-hot);transform:translateY(-1px)}

  /* ================= タブ / パネル / レイアウト ================= */
  .tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:var(--radius);padding:4px}
  .tabs button{flex:1;appearance:none;background:transparent;color:var(--ink-dim);border:none;border-radius:var(--radius);padding:10px 24px;font-size:16px;font-weight:600;cursor:pointer;transition:color .15s,background .15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.active{color:#1a130c;background:linear-gradient(160deg,var(--ember-hot),var(--ember));box-shadow:0 6px 18px -8px var(--ember)}
  .tabs button:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}

  .panel{background:linear-gradient(180deg,var(--panel),var(--bg-soft));border:1px solid var(--panel-edge);border-radius:var(--radius);padding:28px;box-shadow:0 24px 60px -40px rgba(0,0,0,.9)}
  .row{display:flex;flex-wrap:wrap;gap:32px}
  .col{flex:1 1 380px;min-width:0}

  label{display:block;font-size:13px;color:var(--ink-dim);letter-spacing:.1em;margin-bottom:7px}

  /* 見出し（左にアクセントバー） */
  h2{font-size:14px;font-weight:700;letter-spacing:.06em;margin:18px 0 10px;display:flex;align-items:center;gap:9px}
  h2::before{content:'';width:3px;height:14px;background:linear-gradient(var(--ember),var(--ember-deep));box-shadow:0 0 10px -2px var(--ember)}
  .col > h2:first-child{margin-top:0}
  /* 見出し + トグルの横並び */
  .h2-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
  .h2-row h2{margin:0}
  .col > .h2-row:first-child{margin-top:0}
  .click-hint{font-size:12px;font-weight:500;color:var(--ember);letter-spacing:.06em;opacity:.85;margin-left:4px}

  /* ================= トグル ================= */
  .toggle{display:inline-flex;border:1px solid var(--panel-edge);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
  .toggle button{background:transparent;color:var(--ink-dim);border:none;border-right:1px solid var(--panel-edge);padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:color .15s,background .15s}
  .toggle button:last-child{border-right:none}
  .toggle button:hover{color:var(--ink)}
  .toggle button.active{background:linear-gradient(160deg,var(--ember-hot),var(--ember));color:#1a130c;font-weight:700}
  .toggle button:focus-visible{outline:2px solid var(--ember-hot);outline-offset:-2px}
  .toggle-sm button{padding:7px 13px;font-size:14px}

  /* ================= テーブル ================= */
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{position:sticky;top:0;text-align:left;color:var(--ink-dim);font-weight:600;font-size:12px;letter-spacing:.05em;background:var(--panel);border-bottom:1px solid var(--panel-edge);padding:9px 10px}
  th.sortable{cursor:pointer;user-select:none;transition:color .15s,background .15s}
  th.sortable:hover{color:var(--ember-hot);background:rgba(255,138,61,.08)}
  th.sortable.sort-active{color:var(--ember-hot);background:rgba(255,138,61,.12)}
  td{border-bottom:1px solid var(--hairline);padding:10px 12px}
  tbody tr:hover td{background:rgba(255,255,255,.022)}
  td.num,th.num{text-align:right;font-family:var(--num-font);font-weight:600;font-variant-numeric:tabular-nums}
  td.empty{color:var(--ink-faint)}
  /* 大きさバー付き数値セル（--w: 幅%、--f: 0〜1 の割合、--bar: バー色） */
  td.bar{position:relative;isolation:isolate}
  td.bar::before{content:'';position:absolute;left:8px;top:5px;bottom:5px;width:var(--w,0);max-width:calc(100% - 16px);background:var(--bar,rgba(255,138,61,.32));z-index:-1}
  td.bar span{position:relative}
  /* 枠付きテーブル。overflow:clip で角の外にはみ出す行背景を切る（hidden と違いスクロールコンテナを作らないので sticky 見出しは維持） */
  .table-box{overflow:clip;border:1px solid var(--hairline);border-radius:var(--radius)}
  .table-box td:first-child,.table-box th:first-child{padding-left:14px}
  .table-box td:last-child,.table-box th:last-child{padding-right:14px}

  .kit-chip{display:inline-block;width:11px;height:11px;margin-right:8px;box-shadow:0 0 8px -1px currentColor}
  .badge{display:inline-block;font-size:11px;font-family:var(--num-font);font-weight:700;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .badge-win{background:rgba(var(--win),.2);color:rgb(var(--win))}
  .badge-lose{background:rgba(224,112,112,.15);color:#e07070}
  .badge-first{background:rgba(255,200,87,.18);color:var(--ember-hot);font-family:var(--jp-font);font-size:12px;margin-left:0}

  /* ================= チャート ================= */
  .chart-box{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .chart-box.wide{margin-bottom:24px}
  .chart-box.scroll{overflow-y:auto}

  /* ================= キットタブ ================= */
  /* キット一覧表：キット名 15%・残り3列を等分。バーは数字の左側に収め、彩度を少し落とす */
  .kit-list{margin-bottom:24px}
  #table-kits{table-layout:fixed;font-size:16.5px}
  #table-kits th,#table-kits td{padding-left:20px;padding-right:20px}
  #table-kits th{width:calc(85% / 3);font-size:13.5px;border-bottom:2px solid #565d6e}
  #table-kits th:first-child{width:15%}
  #table-kits th + th,#table-kits td + td{border-left:1px solid var(--panel-edge)}
  #table-kits td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #table-kits td.bar::before{top:13px;bottom:13px;left:16px;width:calc((100% - 104px) * var(--f,0));max-width:none;filter:saturate(.8)}
  #table-kits tr.kit-row{cursor:pointer}
  #table-kits tr.selected td{background:rgba(255,138,61,.10)}
  #table-kits tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--ember)}

  /* 選択キット詳細ヘッダー */
  .kit-detail-header{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:18px 22px;background:var(--panel-2);border:1px solid var(--panel-edge);border-radius:var(--radius)}
  .kit-detail-header .kit-chip-lg{width:20px;height:20px;flex-shrink:0;box-shadow:0 0 16px -2px currentColor}
  .kit-detail-header .kit-detail-label{font-size:23px;font-weight:900;letter-spacing:.04em;line-height:1.1}
  .kit-detail-header .kit-detail-name{font-family:var(--num-font);font-size:14px;font-weight:600;color:var(--ember);letter-spacing:.1em;margin-top:4px;text-transform:uppercase}

  /* 全キット比較 */
  .compare-row{margin-top:32px;padding-top:24px;border-top:1px solid var(--hairline)}

  /* ================= 試合タブ ================= */
  /* 勝利チームを緑のエリアで囲う */
  .team-col{padding:14px;border:1px solid transparent;border-radius:var(--radius);transition:background .2s,border-color .2s,box-shadow .2s}
  .team-col.won{background:rgba(var(--win),.05);border-color:rgba(var(--win),.35);box-shadow:0 12px 30px -22px rgba(var(--win),.45)}
  .team-col.won .table-box{border-color:rgba(var(--win),.22)}
  #h2-team-a{color:var(--team-a)}
  #h2-team-b{color:var(--team-b)}
  #h2-team-a::before{background:var(--team-a);box-shadow:0 0 10px -2px var(--team-a)}
  #h2-team-b::before{background:var(--team-b);box-shadow:0 0 10px -2px var(--team-b)}
  tr.team-row td{font-weight:700;padding-top:15px;border-bottom:1px solid var(--panel-edge)}
  tr.team-a td{background:var(--team-a-bg)}
  tr.team-b td{background:var(--team-b-bg)}
  .kda{color:var(--ink-dim);font-size:12px}
  #match-ability-title{margin:8px 0 10px}

  /* ================= カード列（試合・プレイヤー選択、横スクロール） ================= */
  .card-strip{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 14px;margin-bottom:16px;cursor:grab;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:auto;scrollbar-color:var(--ember) var(--panel-edge)}
  .card-strip.dragging{cursor:grabbing;user-select:none;scroll-snap-type:none;scroll-behavior:auto}
  .card-strip.dragging .card{pointer-events:none}
  .card-strip::-webkit-scrollbar{height:12px}
  .card-strip::-webkit-scrollbar-track{background:var(--panel-edge)}
  .card-strip::-webkit-scrollbar-thumb{background:var(--ember);border:2px solid var(--panel-edge);background-clip:padding-box}
  .card-strip::-webkit-scrollbar-thumb:hover{background:var(--ember-hot);background-clip:padding-box}
  .card{flex:0 0 auto;min-width:210px;scroll-snap-align:start;text-align:left;cursor:pointer;
    background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--panel-edge);border-radius:var(--radius);padding:12px 14px;
    color:var(--ink);display:flex;flex-direction:column;gap:6px;
    transition:border-color .15s,transform .1s,box-shadow .15s}
  .card:hover{border-color:var(--edge-hover);transform:translateY(-1px)}
  .card.active{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 10px 24px -14px var(--ember)}
  .card:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}
  .card .mc-date{font-family:var(--num-font);font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.1}
  .card .mc-date small{font-size:13px;font-weight:600;color:var(--ink-dim);margin-left:6px}
  .card .mc-map{font-size:14px;font-weight:700;color:var(--ember-hot)}
  .card .mc-row{display:flex;gap:12px;font-size:13px;color:var(--ink-dim)}
  .card .mc-row b{font-family:var(--num-font);font-weight:600;color:var(--ink);margin-left:4px}
  .player-strip .card{min-width:150px;padding:10px 12px;gap:5px}
  .player-strip .mc-row{gap:8px}
  .card .pc-name{font-family:var(--num-font);font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.1;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .pc-name.uuid{font-size:12px;color:var(--ink-dim);font-weight:600}

  /* ================= プレイヤータブ：統計カード ================= */
  .pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
  .pstat{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--panel-edge);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:5px}
  .pstat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ember),var(--ember-deep))}
  .pstat .pk{font-size:13px;color:var(--ink-dim);letter-spacing:.1em}
  .pstat .pv{font-family:var(--num-font);font-size:29px;font-weight:700;color:var(--ember-hot);line-height:1.1}
  .pstat .psub{font-size:13px;color:var(--ink-dim)}
  .pstat.kit-card .pv{font-size:21px;display:flex;align-items:center;gap:8px;color:var(--ink)}

  /* ================= 読み込み中 / エラー / 名前取得状況 ================= */
  .data-loading{display:flex;flex-direction:column;gap:12px;padding:20px 0}
  .skel{background:linear-gradient(90deg,var(--panel-edge) 25%,var(--panel-2) 50%,var(--panel-edge) 75%);background-size:200% 100%;border-radius:var(--radius);animation:shimmer 1.4s infinite}
  .skel-chart{height:220px}
  .skel-table{height:140px}
  .skel-cards{height:80px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .error{text-align:center;padding:20px;color:#e88a8a;font-family:var(--num-font);letter-spacing:.18em;font-size:14px}
  #name-status{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;padding:12px 4px 0;min-height:20px;text-align:right}

  @media (max-width:640px){
    .wrap{padding:18px 14px 56px}
    h1{font-size:20px}
    .panel{padding:16px}
    .tabs button{padding:9px 8px}
    .kit-detail-header{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🔥</div>
      <h1>フォージウォーズ　統計サイト</h1>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="https://reyonjp.github.io/mypage/" target="_blank">ホーム</a>
      <a class="nav-link" href="https://reyonjp.github.io/wiki/" target="_blank">Wiki</a>
    </nav>
  </header>

  <div class="tabs" role="tablist">
    <button id="tab-kit" class="active" onclick="switchTab('kit')">キット</button>
    <button id="tab-match" onclick="switchTab('match')">試合</button>
    <button id="tab-player" onclick="switchTab('player')">プレイヤー</button>
  </div>

  <!-- ===== キットタブ ===== -->
  <div class="panel" id="view-kit">
    <!-- キット一覧表 -->
    <div class="kit-list">
      <div class="table-box"><table id="table-kits"></table></div>
    </div>

    <!-- 選択キット詳細ヘッダー -->
    <div class="kit-detail-header" id="kit-detail-header">
      <span class="kit-chip-lg" id="kit-detail-chip"></span>
      <div>
        <div class="kit-detail-label">パフォーマンス詳細</div>
        <div class="kit-detail-name" id="kit-detail-name">—</div>
      </div>
    </div>

    <div id="kit-skeleton" class="data-loading">
      <div class="skel skel-chart"></div>
      <div class="skel skel-table"></div>
    </div>
    <div id="kit-content" style="display:none">
      <!-- アビリティ別 + 使用プレイヤー -->
      <div class="row">
        <div class="col">
          <div class="h2-row">
            <h2 id="h2-kit-chart">アビリティ別 平均ダメージ</h2>
            <div class="toggle" id="kit-mode-toggle" role="group" aria-label="アビリティ表示モード">
              <button data-value="avg" class="active" onclick="setKitMode(this.dataset.value)">平均ダメージ</button>
              <button data-value="ratio" onclick="setKitMode(this.dataset.value)">通常攻撃比</button>
            </div>
          </div>
          <div class="chart-box"><canvas id="chart-kit-ability"></canvas></div>
        </div>
        <div class="col">
          <h2>使用したプレイヤー</h2>
          <div class="table-box"><table id="table-kit-players"></table></div>
        </div>
      </div>

      <!-- 全キット比較（3つから選択） -->
      <div class="h2-row compare-row">
        <h2>全キット比較</h2>
        <div class="toggle toggle-sm" id="kit-view-toggle" role="group" aria-label="全キット比較の表示">
          <button data-value="pickWin" class="active" onclick="setKitView(this.dataset.value)">ピック率 × 勝率</button>
          <button data-value="dmgWin" onclick="setKitView(this.dataset.value)">毎分ダメージ × 勝率</button>
          <button data-value="abilityRank" onclick="setKitView(this.dataset.value)">ダメージソース</button>
        </div>
        <span class="click-hint" id="kit-compare-hint"></span>
      </div>
      <div class="chart-box" id="kit-scatter-box"><canvas id="chart-kit-scatter"></canvas></div>
      <div class="chart-box scroll" id="ability-rank-box" style="display:none"><div><canvas id="chart-ability-rank"></canvas></div></div>
    </div>
  </div>

  <!-- ===== 試合タブ ===== -->
  <div class="panel" id="view-match" style="display:none">
    <label>試合を選択</label>
    <div class="card-strip" id="match-strip" role="listbox" aria-label="試合一覧"></div>
    <div id="match-skeleton" class="data-loading">
      <div class="skel skel-table"></div>
      <div class="skel skel-chart"></div>
    </div>
    <div id="match-content" style="display:none">
      <div class="row">
        <div class="col team-col" id="col-team-a">
          <h2 id="h2-team-a">チーム A</h2>
          <div class="table-box"><table id="table-match-a"></table></div>
        </div>
        <div class="col team-col" id="col-team-b">
          <h2 id="h2-team-b">チーム B</h2>
          <div class="table-box"><table id="table-match-b"></table></div>
        </div>
      </div>
      <h2>プレイヤー別 合計ダメージ <span class="click-hint">クリックでアビリティ詳細</span></h2>
      <div class="chart-box wide"><canvas id="chart-match"></canvas></div>
      <!-- クリックで切り替わるアビリティ詳細 -->
      <div id="match-ability-detail" style="display:none">
        <h2 id="match-ability-title"></h2>
        <div class="table-box"><table id="table-match-ability"></table></div>
      </div>
    </div>
  </div>

  <!-- ===== プレイヤータブ ===== -->
  <div class="panel" id="view-player" style="display:none">
    <label>プレイヤーを選択</label>
    <div class="card-strip player-strip" id="player-strip" role="listbox" aria-label="プレイヤー一覧"></div>
    <div id="player-skeleton" class="data-loading">
      <div class="skel skel-cards"></div>
      <div class="skel skel-chart"></div>
    </div>
    <div id="player-content" style="display:none">
      <div class="pstats" id="player-stats"></div>
      <div class="row">
        <div class="col">
          <h2>キット別 毎分平均ダメージ</h2>
          <div class="chart-box"><canvas id="chart-player"></canvas></div>
        </div>
        <div class="col">
          <h2>キット別 成績</h2>
          <div class="table-box"><table id="table-player"></table></div>
        </div>
      </div>
    </div>
  </div>

  <div id="name-status"></div>
</div>

<script>
/* ================================================================
 *  フォージウォーズ 統計サイト — フロントエンド
 *
 *  構成
 *    1. 設定・定数
 *    2. 状態
 *    3. 汎用ユーティリティ（整形・集計・HTML 部品・UI 同期）
 *    4. データ派生（state.rows からの集計）
 *    5. チャート
 *    6. 描画：キット / 試合 / プレイヤー
 *    7. 名前解決（Mojang）
 *    8. 起動
 * ================================================================ */

/* ---------- 1. 設定・定数 ---------- */
const LAMBDA_URL = 'https://2gcjv7f3gcqrygc4ya6gt4z4au0ojrlv.lambda-url.ap-northeast-1.on.aws/';

const PALETTE = ['#ff8a3d','#7fa8c9','#ffc857','#8fbf6b','#c98ad6',
                 '#5fb8a8','#e07070','#b0a07a','#6f8de0','#d6788f'];
const TEAM_COLOR = { A:'#5b9bd5', B:'#d95f5f' };
const SHARED_ABILITY_COLOR = '#7fa8c9';   // 複数キットが持つアビリティ（Basic Attack など）の色
const CHART_THEME = {
  tick:'#9a988f', grid:'rgba(255,255,255,.07)', label:'#cfcdc6',
  font:'Chakra Petch',
  tooltip:{ bg:'#1e2129', border:'#2b2f3a', text:'#ecebe5' },
};
const TABS = ['kit','match','player'];
const NAME_BATCH = 10;
const BASIC_ATTACK = 'Basic_Attack';   // 通常攻撃比の基準アビリティ（データ上の生の名前）

/* ---------- 2. 状態 ---------- */
const state = {
  rows: [],           // 全レコード（Lambda GET の結果）
  names: {},          // UUID → Minecraft 表示名
  kitColors: {},      // キット名 → 色
  charts: {},         // canvasId → Chart インスタンス
  suppressAnim: false,

  // state.rows のみに依存する集計（init で1回だけ計算）
  kitStats: null,     // 全キット統計（derive.kitStats）
  abilityRank: [],    // キット横断のダメージソース順位（derive.abilityRanking）
  kitUseNth: {},      // kitUseKey(プレイヤー, キット, 試合) → そのキットの何回目の使用か

  kit: {
    current: null,        // 選択中のキット
    listSort: 'pickRate', // キット一覧表のソート列：'name'|'pickRate'|'winRate'|'perMin'
    mode: 'avg',          // アビリティ別グラフ：'avg'|'ratio'
    sort: 'avgDmg',       // 使用プレイヤー表のソート列：'count'|'winRate'|'avgDmg'
    view: 'pickWin',      // 全キット比較：'pickWin'|'dmgWin'|'abilityRank'
  },
  match:  { current:null, selected:null },  // current: 表示中の試合ID / selected: { matchId, pid } アビリティ詳細のプレイヤー
  player: { current:null, sort:'uses' },    // current: 表示中のプレイヤーID / sort: 'uses'|'winRate'|'perMin'
};

/* ---------- 3. 汎用ユーティリティ ---------- */
const $ = id => document.getElementById(id);

const fmtInt      = n => Math.round(n).toLocaleString('ja-JP');
const pct         = n => (n*100).toFixed(1)+'%';        // 0-1 スケール
const pctFromUnit = v => v.toFixed(1)+'%';              // 0-100 スケール（チャート用）
const fmtRatio    = v => '×'+v.toFixed(2);
const fmtClock    = s => s==null ? '-' : `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const disp        = uuid => state.names[uuid] || uuid;
const esc         = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const maxOf       = arr => arr.length ? Math.max(...arr) : 0;
const uniq        = arr => [...new Set(arr)];
const byDesc      = fn => (a,b) => fn(b)-fn(a);
const sleep       = ms => new Promise(r=>setTimeout(r,ms));

// アビリティ名の表示用整形（"_Damage" 除去・アンダースコアを空白に）。ロジックは必ず生の名前を使う。
function prettyAbility(name){
  const s=String(name).replace(/_?[Dd]amage/g,'').replace(/_+/g,' ').replace(/\s+/g,' ').trim();
  return s || String(name);
}

// 「1ピック」＝ 試合×プレイヤー のキー
const pickKey = r => r.matchId+'|'+r.playerId;
// キット使用回数の参照キー（derive.kitUseNth と対応）
const kitUseKey = (pid, kit, matchId) => pid+'|'+kit+'|'+matchId;

/* 毎分ダメージ集計
 * 試合時間のある試合だけを対象に「合計ダメージ ÷ 合計試合時間(分)」を出す。
 * 試合ごとに長さが違うため、ピック平均ではなく総量どうしの比で求める。 */
const perMin = {
  create: () => ({ dmg:0, minutes:0, seen:new Set() }),
  add(acc, r){
    if(!(r.duration > 0)) return;            // 時間データのない試合は除外（通常は Lambda 側で除外済み）
    acc.dmg += r.damage;
    const k = pickKey(r);
    if(!acc.seen.has(k)){ acc.seen.add(k); acc.minutes += r.duration/60; }
  },
  value: acc => acc.minutes > 0 ? acc.dmg/acc.minutes : null,
};

/* --- HTML 部品 --- */
// 右寄せ数値セル＋背景に大きさバー（color: バーの色 #rrggbb、省略時はテーマ色）
function barCell(val, max, text = fmtInt(val), color){
  const w = max>0 ? Math.max(2, Math.round(val/max*100)) : 0;
  const bar = color ? `;--bar:${color}8c` : '';
  return `<td class="num bar" style="--w:${w}%;--f:${w/100}${bar}"><span>${text}</span></td>`;
}
const EMPTY_CELL = '<td class="num empty">-</td>';
const kitChip = kit => `<span class="kit-chip" style="background:${state.kitColors[kit] ?? 'transparent'}"></span>`;

// ソート可能な列見出し（クリックで handler(key) を呼ぶ）
function sortableTh(key, label, activeKey, handler, cls = 'num'){
  return `<th class="${cls} sortable${key===activeKey ? ' sort-active' : ''}" onclick="${handler}('${key}')">${label}</th>`;
}

// 表示の切り替え・並べ替えだけの再描画（チャートのアニメーションは流さない）
function rerenderQuiet(fn){
  state.suppressAnim=true;
  try{ fn(); } finally{ state.suppressAnim=false; }
}

/* ---------- 4. データ派生 ---------- */
const derive = {
  // 全キット統計：ピック率・勝率・毎分ダメージ。kits はピック数の多い順
  kitStats(rows){
    const seen=new Set();
    const stats={};                // kit → { picks, wins, pm }
    rows.forEach(r=>{
      const s = stats[r.kit] ??= { picks:0, wins:0, pm:perMin.create() };
      perMin.add(s.pm, r);
      const key=pickKey(r)+'|'+r.kit;
      if(seen.has(key)) return;
      seen.add(key);
      s.picks++;
      if(r.won) s.wins++;
    });
    const totalPicks=seen.size;
    return {
      kits:    Object.keys(stats).sort(byDesc(k=>stats[k].picks)),
      winRate: k => stats[k] ? stats[k].wins/stats[k].picks : 0,
      pickRate:k => totalPicks ? (stats[k]?.picks ?? 0)/totalPicks : 0,
      perMin:  k => stats[k] ? perMin.value(stats[k].pm) : null,
    };
  },

  // プレイヤー×キットごとに使用した試合を日時順に並べ、各試合が何回目の使用かを求める
  kitUseNth(rows){
    const matchDate={};
    const uses={};                 // プレイヤー|キット → { pid, kit, ids:試合IDの Set }
    rows.forEach(r=>{
      matchDate[r.matchId] ??= String(r.date);
      (uses[r.playerId+'|'+r.kit] ??= { pid:r.playerId, kit:r.kit, ids:new Set() }).ids.add(r.matchId);
    });
    const nth={};
    Object.values(uses).forEach(({ pid, kit, ids })=>{
      [...ids].sort((a,b)=>matchDate[a].localeCompare(matchDate[b]) || String(a).localeCompare(String(b)))
              .forEach((id,i)=>{ nth[kitUseKey(pid, kit, id)]=i+1; });
    });
    return nth;
  },

  // キットを問わずアビリティ名ごとに毎分ダメージを集計（降順）
  abilityRanking(rows){
    const byAb={};
    rows.forEach(r=>{
      const a = byAb[r.ability] ??= { pm:perMin.create(), kits:new Set() };
      perMin.add(a.pm, r);
      a.kits.add(r.kit);
    });
    return Object.entries(byAb)
      .map(([ability,a])=>({ ability, kits:[...a.kits].sort(), perMin:perMin.value(a.pm) }))
      .filter(a=>a.perMin!=null)
      .sort(byDesc(a=>a.perMin));
  },

  // キット1つ分のアビリティ統計（平均ダメージ & 通常攻撃比）
  kitAbilities(rows){
    const avg={};                  // ability → { sum, n }
    rows.forEach(r=>{
      const a = avg[r.ability] ??= { sum:0, n:0 };
      a.sum += r.damage; a.n++;
    });

    // 通常攻撃比：ピックごとに「アビリティ / そのピックの通常攻撃」を出して平均
    const perPick={};
    rows.forEach(r=>{
      const p = perPick[pickKey(r)] ??= {};
      p[r.ability]=(p[r.ability]||0)+r.damage;
    });
    const ratio={};
    Object.values(perPick).forEach(p=>{
      const base=p[BASIC_ATTACK];
      if(!(base > 0)) return;
      Object.entries(p).forEach(([ab,dmg])=>{
        const g = ratio[ab] ??= { sum:0, n:0 };
        g.sum += dmg/base; g.n++;
      });
    });
    const mean = g => g.sum/g.n;
    return { abilities:Object.keys(avg).sort(), avg:a=>mean(avg[a]), ratio:a=>ratio[a] ? mean(ratio[a]) : null };
  },

  // キット1つ分のプレイヤー別統計（使用回数・勝率・毎分平均ダメージ）
  kitPlayers(rows){
    const byPlayer={};
    rows.forEach(r=>{
      const p = byPlayer[r.playerId] ??= { pid:r.playerId, picks:new Set(), wins:new Set(), pm:perMin.create() };
      p.picks.add(pickKey(r));
      if(r.won) p.wins.add(r.matchId);
      perMin.add(p.pm, r);
    });
    return Object.values(byPlayer).map(p=>({
      pid:    p.pid,
      count:  p.picks.size,
      winRate:p.wins.size/p.picks.size,
      avgDmg: perMin.value(p.pm) ?? 0,     // 時間データなしは 0 として末尾へ
    }));
  },

  // 試合一覧（新しい順）。カード表示用に日付/時刻/マップ/人数/試合時間をまとめる
  matchList(rows){
    const byId={};
    rows.forEach(r=>{
      const m = byId[r.matchId] ??= { id:r.matchId, date:r.date, map:r.map, duration:r.duration, players:new Set() };
      m.players.add(r.playerId);
    });
    return Object.values(byId)
      .map(m=>{
        const [d='', t='']=String(m.date).split(/\s+/);
        return { id:m.id, dateText:d, timeText:t.replace(/:\d{2}$/,''), map:m.map||'-', players:m.players.size, duration:m.duration };
      })
      .sort((a,b)=>String(b.dateText+b.timeText).localeCompare(String(a.dateText+a.timeText)));
  },

  // プレイヤー一覧（名前解決済みを先に、名前順）。カード表示用
  playerList(rows){
    const byId={};
    rows.forEach(r=>{
      const p = byId[r.playerId] ??= { id:r.playerId, matches:new Set(), wins:new Set() };
      p.matches.add(r.matchId);
      if(r.won) p.wins.add(r.matchId);
    });
    return Object.values(byId)
      .map(p=>({ id:p.id, name:disp(p.id), matches:p.matches.size,
                 winRate: p.matches.size ? p.wins.size/p.matches.size : 0 }))
      .sort((a,b)=> (a.name===a.id)-(b.name===b.id) || a.name.localeCompare(b.name,'en',{ sensitivity:'base' }));
  },

  // 試合1つ分のプレイヤー別モデル（合計ダメージ降順）
  matchPlayers(rows){
    const byPid={};
    rows.forEach(r=>{
      const p = byPid[r.playerId] ??= {
        pid:r.playerId, name:disp(r.playerId), kit:r.kit, team:r.team, won:r.won,
        kills:r.kills, deaths:r.deaths, assists:r.assists, total:0, abilities:[]
      };
      p.total+=r.damage;
      p.abilities.push(r);
    });
    const players=Object.values(byPid).sort(byDesc(p=>p.total));
    return {
      byPid, players,
      team: t => players.filter(p=>p.team===t),
      hasKDA: rows.some(r=>r.kills!=null),
    };
  },

  // プレイヤー1人分：キット別成績 と 試合単位の集計
  playerProfile(rows){
    const kitStat={};
    rows.forEach(r=>{
      const k = kitStat[r.kit] ??= { picks:new Set(), wins:new Set(), pm:perMin.create() };
      k.picks.add(pickKey(r));
      if(r.won) k.wins.add(r.matchId);
      perMin.add(k.pm, r);
    });
    const kitRows = Object.entries(kitStat).map(([kit,k])=>({
      kit,
      uses:    k.picks.size,
      winRate: k.wins.size/k.picks.size,
      perMin:  perMin.value(k.pm),
    })).sort(byDesc(k=>k.uses));

    const matchMeta={};
    rows.forEach(r=>{
      matchMeta[r.matchId] ??= { won:r.won, kills:r.kills, deaths:r.deaths, assists:r.assists, kit:r.kit };
    });
    const matches=Object.values(matchMeta);
    const kitUse={};
    matches.forEach(m=>{ kitUse[m.kit]=(kitUse[m.kit]||0)+1; });
    const played=matches.length;
    const topKit=Object.keys(kitUse).sort(byDesc(k=>kitUse[k]))[0];
    return {
      kitRows, played, kitUse, topKit,
      won: matches.filter(m=>m.won).length,
      topKitShare: topKit && played ? kitUse[topKit]/played : 0,
      hasKDA: matches.some(m=>m.kills!=null),
      kda: ['kills','deaths','assists'].map(f=>matches.reduce((s,m)=>s+(m[f]||0),0)),
    };
  },
};

/* ---------- 5. チャート ---------- */
if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);
Chart.defaults.font.size = 13;   // 目盛り・ツールチップ等の既定サイズ（Chart.js 既定は 12）

const tooltipStyle = () => ({
  backgroundColor:CHART_THEME.tooltip.bg, borderColor:CHART_THEME.tooltip.border, borderWidth:1,
  titleColor:CHART_THEME.tooltip.text, bodyColor:CHART_THEME.tooltip.text, padding:10, cornerRadius:2,
  titleFont:{ family:CHART_THEME.font }, bodyFont:{ family:CHART_THEME.font },
});
const axisStyle = (tickFont = {}) => ({
  ticks:{ color:CHART_THEME.tick, font:{ family:CHART_THEME.font, ...tickFont } },
  grid:{ color:CHART_THEME.grid, drawBorder:false },
});
const valueLabelFont = () => ({ family:CHART_THEME.font, size:12, weight:600 });
const pointerOnHover = (e,els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; };

// 選択中は不透明、それ以外は半透明
const highlight = (kit, selected) => selected===kit ? state.kitColors[kit] : state.kitColors[kit]+'66';

// 既存のチャートを破棄して作り直す
function makeChart(canvasId, config){
  state.charts[canvasId]?.destroy();
  config.options.animation = state.suppressAnim ? false : undefined;
  return state.charts[canvasId] = new Chart($(canvasId), config);
}

/**
 * 横棒グラフを描く。高さは本数に合わせてキャンバスの親要素に設定する。
 * @param {string} canvasId
 * @param {{labels:string[], data:number[], colors:string[], format?:(v)=>string,
 *          onClick?:(label,index)=>void, detail?:(index)=>string}} opt
 *   detail: ツールチップに追加で出す1行
 */
function barChart(canvasId, { labels, data, colors, format = fmtInt, onClick, detail }){
  const yAxis=axisStyle({ size:12 });
  yAxis.ticks.autoSkip=false;   // ラベルを間引かず全件表示
  const chart=makeChart(canvasId,{
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor:colors, borderRadius:0, maxBarThickness:30 }] },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ right:56 } },
      onClick: onClick && ((e,els)=>{ if(els.length){ const i=els[0].index; onClick(labels[i], i); } }),
      onHover: onClick && pointerOnHover,
      plugins:{
        legend:{ display:false },
        tooltip:{ ...tooltipStyle(), callbacks:{ label:c=>format(c.raw), afterLabel: detail && (c=>detail(c.dataIndex)) } },
        datalabels:{ anchor:'end', align:'end', clamp:true, color:CHART_THEME.label, font:valueLabelFont(), formatter:format },
      },
      scales:{
        x:axisStyle(),
        y:yAxis,
      }
    }
  });
  $(canvasId).parentElement.style.height = Math.max(220, labels.length*36+90)+'px';
  chart.resize();
}

// 散布図の基準線（破線）。plugins.refLines:{ x?:number, y?:number } をデータ座標で指定
const refLinePlugin = {
  id:'refLines',
  beforeDatasetsDraw(chart, _args, opts){
    const { ctx, chartArea:a, scales:{ x, y } } = chart;
    ctx.save();
    ctx.strokeStyle='rgba(255,200,87,.35)'; ctx.lineWidth=1; ctx.setLineDash([5,5]);
    if(opts.x!=null){ const px=x.getPixelForValue(opts.x); ctx.beginPath(); ctx.moveTo(px,a.top); ctx.lineTo(px,a.bottom); ctx.stroke(); }
    if(opts.y!=null){ const py=y.getPixelForValue(opts.y); ctx.beginPath(); ctx.moveTo(a.left,py); ctx.lineTo(a.right,py); ctx.stroke(); }
    ctx.restore();
  },
};

/**
 * キットの散布図（縦軸は勝率 0-100 固定、横軸は指定）を描く。
 * @param {string} canvasId
 * @param {{points:{kit:string,x:number,y:number}[], selected:string,
 *          x:{title:string, format:(v)=>string, tick:(v)=>string}, refX?:number, onClick?:(kit)=>void}} opt
 *   refX: 横軸の基準線（破線）の位置。縦軸は勝率 50% に基準線
 */
function scatterChart(canvasId, { points, selected, x:xAxis, refX, onClick }){
  const isSel=p=>p.kit===selected;
  const axis=(title,tick)=>{
    const s=axisStyle();
    return { ...s, ticks:{ ...s.ticks, callback:tick },
             title:{ display:true, text:title, color:CHART_THEME.label, font:{ family:'Noto Sans JP', size:13, weight:700 } } };
  };
  makeChart(canvasId,{
    type:'scatter',
    data:{ datasets:[{
      data:points,
      pointStyle:'rect',
      pointBackgroundColor:points.map(p=>highlight(p.kit,selected)),
      pointBorderColor:    points.map(p=>isSel(p) ? '#fff' : state.kitColors[p.kit]),
      pointBorderWidth:    points.map(p=>isSel(p) ? 2 : 1),
      pointRadius:         points.map(p=>isSel(p) ? 9 : 7),
      pointHoverRadius:11,
    }] },
    plugins:[refLinePlugin],
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:18, right:28 } },
      onClick: onClick && ((e,els)=>{ if(els.length) onClick(points[els[0].index].kit); }),
      onHover: onClick && pointerOnHover,
      plugins:{
        legend:{ display:false },
        refLines:{ x:refX, y:50 },
        tooltip:{ ...tooltipStyle(), callbacks:{
          title:items=>items[0].raw.kit,
          label:c=>[`${xAxis.title} ${xAxis.format(c.raw.x)}`, `勝率 ${pctFromUnit(c.raw.y)}`],
        } },
        datalabels:{ align:'top', offset:6, clamp:true, font:valueLabelFont(), formatter:v=>v.kit,
                     color:c=>isSel(points[c.dataIndex]) ? CHART_THEME.tooltip.text : CHART_THEME.label },
      },
      scales:{
        x:{ ...axis(xAxis.title, xAxis.tick), beginAtZero:true, grace:'8%' },
        y:{ ...axis('勝率', v=>v+'%'), min:0, max:100 },
      }
    }
  });
}

/* ---------- 6-a. キットタブ ---------- */
function renderKit(){
  const kit=state.kit.current;
  if(!kit) return;
  renderKitTable(kit);
  renderKitHeader(kit);
  renderKitDetail(kit);
  renderKitCompare(kit);
}

// キット一覧表（見出しクリックでソート列切替。キット名は昇順、数値は降順）
function renderKitTable(kit){
  const ks=state.kitStats;
  const sortKey=state.kit.listSort;
  const pm=k=>ks.perMin(k) ?? -1;   // 時間データなしは末尾へ
  const kits = sortKey==='name'
    ? [...ks.kits].sort((a,b)=>a.localeCompare(b,'ja'))
    : [...ks.kits].sort(byDesc({ pickRate:ks.pickRate, winRate:ks.winRate, perMin:pm }[sortKey]));
  const maxPick=maxOf(kits.map(ks.pickRate));
  const maxPm=maxOf(kits.map(pm));
  const th=(key,label,cls)=>sortableTh(key,label,sortKey,'sortKitList',cls);

  $('table-kits').innerHTML =
    `<tr>${th('name','キット','')}${th('pickRate','ピック率')}${th('winRate','勝率')}${th('perMin','毎分ダメージ')}</tr>`
    + kits.map(k=>{
        const c=state.kitColors[k];
        const perMinVal=ks.perMin(k);
        return `<tr class="kit-row${k===kit?' selected':''}" data-kit="${esc(k)}" onclick="selectKit(this.dataset.kit)">`
          + `<td>${kitChip(k)}${esc(k)}</td>`
          + barCell(ks.pickRate(k), maxPick, pct(ks.pickRate(k)), c)
          + barCell(ks.winRate(k), 1, pct(ks.winRate(k)), c)
          + (perMinVal!=null ? barCell(perMinVal, maxPm, fmtInt(perMinVal), c) : EMPTY_CELL)
          + `</tr>`;
      }).join('');
}

function renderKitHeader(kit){
  $('kit-detail-name').textContent=kit;
  const chip=$('kit-detail-chip');
  chip.style.background = chip.style.color = state.kitColors[kit] || '#888';
}

// 選択キットのアビリティ別グラフ + 使用プレイヤー表
function renderKitDetail(kit){
  const rows=state.rows.filter(r=>r.kit===kit);
  const color=state.kitColors[kit];

  // アビリティ別（平均 / 通常攻撃比）
  const ab=derive.kitAbilities(rows);
  const isRatio = state.kit.mode==='ratio';
  $('h2-kit-chart').textContent = isRatio ? 'アビリティ別 通常攻撃比' : 'アビリティ別 平均ダメージ';
  const labels = isRatio ? ab.abilities.filter(a=>ab.ratio(a)!=null) : ab.abilities;
  barChart('chart-kit-ability',{
    labels: labels.map(prettyAbility),
    data:   labels.map(isRatio ? ab.ratio : ab.avg),
    colors: labels.map(()=>color),
    format: isRatio ? fmtRatio : fmtInt,
  });

  // 使用プレイヤー（見出しクリックでソート列切替、常に降順）
  const sortKey=state.kit.sort;
  const players=derive.kitPlayers(rows).sort(byDesc(p=>p[sortKey]));
  const maxAvg=maxOf(players.map(p=>p.avgDmg));
  const th=(key,label)=>sortableTh(key,label,sortKey,'sortKitPlayers');

  $('table-kit-players').innerHTML =
    `<tr><th>プレイヤー</th>${th('count','使用回数')}${th('winRate','勝率')}${th('avgDmg','毎分平均ダメージ')}</tr>`
    + players.map(p=>`<tr><td>${esc(disp(p.pid))}</td><td class="num">${p.count}</td>`
                     + `<td class="num">${pct(p.winRate)}</td>${barCell(p.avgDmg,maxAvg)}</tr>`).join('');
}

// 全キット比較（ピック率×勝率 / 毎分ダメージ×勝率 / ダメージソース ランキング）
function renderKitCompare(kit){
  const ks=state.kitStats;
  const view=state.kit.view;
  const isRank = view==='abilityRank';
  $('kit-scatter-box').style.display = isRank ? 'none' : '';
  $('ability-rank-box').style.display = isRank ? '' : 'none';
  $('kit-compare-hint').textContent = isRank
    ? `全キット共通・毎分ダメージ（全${state.abilityRank.length}件・スクロール）`
    : 'クリックで詳細';

  // 散布図とランキングの枠は同じ高さ（ランキングははみ出た分を縦スクロール）
  const boxHeight=Math.max(360, ks.kits.length*36+90)+'px';
  $('kit-scatter-box').style.height = $('ability-rank-box').style.height = boxHeight;

  // 非表示側のキャンバスはサイズ 0 になるため、表示中のものだけ描く。
  // ランキングはキット選択に依存しないので、未作成のときだけ描く
  if(isRank){
    if(!state.charts['chart-ability-rank']) renderAbilityRanking();
    return;
  }
  const common={ selected:kit, onClick:selectKit };
  if(view==='pickWin'){
    scatterChart('chart-kit-scatter',{ ...common,
      points:ks.kits.map(k=>({ kit:k, x:ks.pickRate(k)*100, y:ks.winRate(k)*100 })),
      x:{ title:'ピック率', format:pctFromUnit, tick:v=>v+'%' },
      refX: ks.kits.length ? 100/ks.kits.length : null,   // 全キット均等に選ばれた場合のピック率
    });
  }else{
    const points=ks.kits.filter(k=>ks.perMin(k)!=null)    // 時間データのないキットは除外
      .map(k=>({ kit:k, x:ks.perMin(k), y:ks.winRate(k)*100 }));
    scatterChart('chart-kit-scatter',{ ...common, points,
      x:{ title:'毎分ダメージ', format:fmtInt, tick:v=>fmtInt(v) },
      refX: points.length ? points.reduce((s,p)=>s+p.x,0)/points.length : null,   // キット平均
    });
  }
}

// キットを問わないダメージソース全件ランキング
function renderAbilityRanking(){
  const list=state.abilityRank;
  const single=a=>a.kits.length===1;
  barChart('chart-ability-rank',{
    labels:list.map(a=>single(a) ? `${prettyAbility(a.ability)}（${a.kits[0]}）` : prettyAbility(a.ability)),
    data:  list.map(a=>a.perMin),
    colors:list.map(a=>single(a) ? state.kitColors[a.kits[0]] : SHARED_ABILITY_COLOR),
    detail:i=>'キット: '+list[i].kits.join(', '),
  });
}

// 表の行・散布図の点クリック → キット選択して詳細へスクロール
function selectKit(kit){
  if(state.kit.current===kit) return;
  state.kit.current=kit;
  renderKit();
  $('kit-detail-header').scrollIntoView({ behavior:'smooth', block:'start' });
}

function sortKitList(key){
  state.kit.listSort=key;
  renderKitTable(state.kit.current);
}

function setKitMode(mode){
  state.kit.mode=mode;
  syncToggle('kit-mode-toggle', mode);
  rerenderQuiet(()=>renderKitDetail(state.kit.current));
}

function sortKitPlayers(key){
  state.kit.sort=key;
  rerenderQuiet(()=>renderKitDetail(state.kit.current));
}

function setKitView(view){
  state.kit.view=view;
  syncToggle('kit-view-toggle', view);
  if(state.kit.current) renderKitCompare(state.kit.current);
}

/* ---------- 6-b. 試合タブ ---------- */
function renderMatch(){
  const id=state.match.current;
  const rows=state.rows.filter(r=>r.matchId===id);
  const meta=rows[0];
  syncStrip('match-strip', id);

  if(!rows.length){
    $('table-match-a').innerHTML=$('table-match-b').innerHTML='';
    $('col-team-a').classList.remove('won'); $('col-team-b').classList.remove('won');
    $('match-ability-detail').style.display='none';
    return;
  }

  const m=derive.matchPlayers(rows);
  const aWon=Boolean(m.team('A')[0]?.won);

  barChart('chart-match',{
    labels:m.players.map(p=>p.name),
    data:  m.players.map(p=>p.total),
    colors:m.players.map(p=>TEAM_COLOR[p.team] ?? TEAM_COLOR.B),
    onClick:(label,i)=>renderMatchAbility(m.players[i], meta, id),
  });

  const badge=won=>won ? '<span class="badge badge-win">🏆 WIN</span>' : '<span class="badge badge-lose">LOSE</span>';
  $('h2-team-a').innerHTML=`チーム A ${badge(aWon)}`;
  $('h2-team-b').innerHTML=`チーム B ${badge(!aWon)}`;
  $('col-team-a').classList.toggle('won',aWon);
  $('col-team-b').classList.toggle('won',!aWon);
  $('table-match-a').innerHTML=teamTable(m.team('A'),'a',id,m.hasKDA);
  $('table-match-b').innerHTML=teamTable(m.team('B'),'b',id,m.hasKDA);

  // アビリティ詳細：同じ試合で選択済みならそれを維持、なければ1位
  const sel=state.match.selected;
  const target = (sel && sel.matchId===id && m.byPid[sel.pid]) ? m.byPid[sel.pid] : m.players[0];
  renderMatchAbility(target, meta, id);
}

// チームメンバー表（ダメージは下のグラフに任せ、そのキットを何回目に使ったかを出す）
function teamTable(players, teamClass, matchId, hasKDA){
  return `<tr><th>プレイヤー — キット</th><th class="num">キット使用</th></tr>` + players.map(p=>{
    const kda = hasKDA && p.kills!=null ? ` <span class="kda">K${p.kills}/D${p.deaths}/A${p.assists}</span>` : '';
    const n = state.kitUseNth[kitUseKey(p.pid, p.kit, matchId)];
    const nth = n===1 ? '<span class="badge badge-first">初</span>' : n ? `${n}回目` : '-';
    return `<tr class="team-row team-${teamClass}"><td><strong>${esc(p.name)}</strong> — ${esc(p.kit)}${kda}</td>`
         + `<td class="num">${nth}</td></tr>`;
  }).join('');
}

// 選択プレイヤーのアビリティ別ダメージ（試合時間があれば毎分列を追加）
function renderMatchAbility(player, meta, matchId){
  if(!player) return;
  state.match.selected={ matchId, pid:player.pid };

  const abs=[...player.abilities].sort(byDesc(r=>r.damage));
  const minutes = meta?.duration>0 ? meta.duration/60 : null;
  const maxPerMin = minutes ? maxOf(abs.map(r=>r.damage))/minutes : 0;

  $('match-ability-detail').style.display='block';
  $('match-ability-title').textContent=`${player.name} — ${player.kit} アビリティ別ダメージ`;
  $('table-match-ability').innerHTML =
    `<tr><th>アビリティ</th>${minutes?'<th class="num">ダメージ(毎分)</th>':''}<th class="num">総ダメージ</th></tr>`
    + abs.map(r=>`<tr><td>${esc(prettyAbility(r.ability))}</td>`
                + (minutes ? barCell(r.damage/minutes,maxPerMin) : '')
                + `<td class="num">${fmtInt(r.damage)}</td></tr>`).join('');
}

function selectMatch(id){
  if(state.match.current===id) return;
  state.match.current=id;
  renderMatch();
  scrollCardIntoView('match-strip', id);
}

/* ---------- 6-c. プレイヤータブ ---------- */
function renderPlayer(){
  const pid=state.player.current;
  syncStrip('player-strip', pid);
  const p=derive.playerProfile(state.rows.filter(r=>r.playerId===pid));

  // キット別 毎分平均ダメージ（時間データのあるキットのみ）
  const withPm=p.kitRows.filter(k=>k.perMin!=null).sort(byDesc(k=>k.perMin));
  barChart('chart-player',{
    labels:withPm.map(k=>k.kit),
    data:  withPm.map(k=>k.perMin),
    colors:withPm.map(k=>state.kitColors[k.kit]),
  });

  // 統計カード
  const card=(k,v,sub='')=>`<div class="pstat"><span class="pk">${k}</span><span class="pv">${v}</span><span class="psub">${sub}</span></div>`;
  const [K,D,A]=p.kda;
  $('player-stats').innerHTML =
      card('試合数', p.played, `${p.won}勝 ${p.played-p.won}敗`)
    + card('勝率', p.played ? pct(p.won/p.played) : '—', `${p.kitRows.length} キット使用`)
    + `<div class="pstat kit-card"><span class="pk">最多使用キット</span>`
    + `<span class="pv">${kitChip(p.topKit)}${p.topKit ? esc(p.topKit) : '—'}</span>`
    + `<span class="psub">${p.topKit ? `${p.kitUse[p.topKit]}試合 ・ 全体の${pct(p.topKitShare)}` : ''}</span></div>`
    + (p.hasKDA ? card('K / D / A', `${K}/${D}/${A}`, `KD比 ${D ? (K/D).toFixed(2) : '∞'}`) : '');

  // キット別成績表（見出しクリックでソート列切替、常に降順）
  const sortKey=state.player.sort;
  const value={ uses:k=>k.uses, winRate:k=>k.winRate, perMin:k=>k.perMin ?? 0 }[sortKey];
  const kitRows=[...p.kitRows].sort(byDesc(value));
  const maxPm=maxOf(p.kitRows.map(k=>k.perMin ?? 0));
  const th=(key,label)=>sortableTh(key,label,sortKey,'sortPlayerKits');

  $('table-player').innerHTML =
    `<tr><th>キット</th>${th('uses','使用数')}${th('winRate','勝率')}${th('perMin','毎分平均ダメージ')}</tr>`
    + kitRows.map(k=>`<tr><td>${kitChip(k.kit)}${esc(k.kit)}</td>`
                   + `<td class="num">${k.uses}</td><td class="num">${pct(k.winRate)}</td>`
                   + (k.perMin!=null ? barCell(k.perMin,maxPm) : EMPTY_CELL)
                   + `</tr>`).join('');
}

function selectPlayer(id){
  if(state.player.current===id) return;
  state.player.current=id;
  renderPlayer();
  scrollCardIntoView('player-strip', id);
}

function sortPlayerKits(key){
  state.player.sort=key;
  rerenderQuiet(renderPlayer);
}

/* ---------- 7. 名前解決（Mojang via Lambda POST） ---------- */
async function fetchNames(uuids){
  const res=await fetch(LAMBDA_URL,{ method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ uuids }) });
  if(!res.ok) throw new Error('HTTP '+res.status);
  return (await res.json()).data;
}

// 名前が増えるたびに、表示名を使う箇所だけ描き直す（アニメーションなし）
function applyNames(map){
  Object.assign(state.names,map);
  rerenderQuiet(()=>{
    buildPlayerStrip();
    renderKit(); renderMatch(); renderPlayer();
  });
}

// バッチを同時に投げると Mojang のレート制限に当たるため順番に処理し、取りこぼしは2巡目で再試行
async function loadNames(){
  const uuids=uniq(state.rows.map(r=>r.playerId));
  const status=$('name-status');
  const unresolved=()=>uuids.filter(u=>!state.names[u]||state.names[u]===u);

  const runBatches=async(list,label)=>{
    for(let i=0;i<list.length;i+=NAME_BATCH){
      status.textContent=`${label} (${Math.min(i+NAME_BATCH,list.length)}/${list.length})`;
      try{ applyNames(await fetchNames(list.slice(i,i+NAME_BATCH))); }
      catch(e){ console.warn('name batch failed:',e); }
    }
  };

  await runBatches(uuids,'プレイヤー名を取得中…');
  if(unresolved().length){ await sleep(1200); await runBatches(unresolved(),'プレイヤー名を再取得中…'); }

  const missing=unresolved().length;
  status.textContent = missing ? `${missing}件のプレイヤー名を取得できませんでした` : '';
}

/* ---------- 8. 起動 ---------- */
// 試合カード列（データのみ依存なので init で1回）
function buildMatchStrip(){
  const list=derive.matchList(state.rows);
  $('match-strip').innerHTML=list.map(m=>
    `<button type="button" class="card" role="option" data-id="${esc(m.id)}" onclick="selectMatch(this.dataset.id)">`
    + `<div class="mc-date">${esc(m.dateText)}<small>${esc(m.timeText)}</small></div>`
    + `<div class="mc-map">${esc(m.map)}</div>`
    + `<div class="mc-row"><span>人数<b>${m.players}</b></span><span>時間<b>${fmtClock(m.duration)}</b></span></div>`
    + `</button>`).join('');
  return list;
}

// プレイヤーカード列（名前解決で表示名・並び順が変わるため再構築されうる）
function buildPlayerStrip(){
  const list=derive.playerList(state.rows);
  const el=$('player-strip');
  const keepScroll=el.scrollLeft;
  el.innerHTML=list.map(p=>
    `<button type="button" class="card" role="option" data-id="${esc(p.id)}" onclick="selectPlayer(this.dataset.id)">`
    + `<div class="pc-name${p.name===p.id?' uuid':''}" title="${esc(p.name)}">${esc(p.name)}</div>`
    + `<div class="mc-row"><span>試合<b>${p.matches}</b></span><span>勝率<b>${pct(p.winRate)}</b></span></div>`
    + `</button>`).join('');
  el.scrollLeft=keepScroll;
  return list;
}

// カード列をマウス/ペンのドラッグでもスクロールできるようにする（タッチは標準挙動のまま）
function enableDragScroll(el){
  let startX=0, startLeft=0, moved=false, active=false;
  const DRAG_THRESHOLD=6;   // これ未満の移動はクリック扱い

  el.addEventListener('pointerdown', e=>{
    if(e.pointerType==='touch' || e.button!==0) return;
    active=true; moved=false;
    startX=e.clientX; startLeft=el.scrollLeft;
  });
  el.addEventListener('pointermove', e=>{
    if(!active) return;
    const dx=e.clientX-startX;
    if(!moved && Math.abs(dx)>DRAG_THRESHOLD){
      moved=true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
    }
    if(moved) el.scrollLeft=startLeft-dx;
  });
  const end=e=>{
    if(!active) return;
    active=false;
    if(moved){
      // ドラッグ直後の click がカード選択にならないよう1回だけ握りつぶす
      const swallow=ev=>{ ev.stopPropagation(); ev.preventDefault(); };
      el.addEventListener('click', swallow, { capture:true, once:true });
      setTimeout(()=>el.removeEventListener('click', swallow, { capture:true }), 0);
      el.classList.remove('dragging');
      if(el.hasPointerCapture?.(e.pointerId)) el.releasePointerCapture(e.pointerId);
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', ()=>{ if(active && !moved) active=false; });
}

function init(rows){
  state.rows=rows;
  const kits=uniq(rows.map(r=>r.kit)).sort();
  kits.forEach((k,i)=>state.kitColors[k]=PALETTE[i%PALETTE.length]);
  state.kitStats=derive.kitStats(rows);
  state.abilityRank=derive.abilityRanking(rows);
  state.kitUseNth=derive.kitUseNth(rows);

  state.kit.current    = kits[0] ?? null;
  state.match.current  = buildMatchStrip()[0]?.id ?? null;
  state.player.current = buildPlayerStrip()[0]?.id ?? null;
  enableDragScroll($('match-strip'));
  enableDragScroll($('player-strip'));

  TABS.forEach(t=>{
    $(t+'-skeleton').style.display='none';
    $(t+'-content').style.display='block';
  });
  renderKit(); renderMatch(); renderPlayer();

  loadNames();
}

fetch(LAMBDA_URL)
  .then(r=>{ if(!r.ok) throw new Error('サーバーエラー ('+r.status+')'); return r.json(); })
  .then(result=>init(result.data))
  .catch(e=>{
    TABS.forEach(t=>{ $(t+'-skeleton').innerHTML=`<div class="error">読み込み失敗: ${esc(e.message)}</div>`; });
  });
</script>
