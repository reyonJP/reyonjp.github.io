<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  /* ================= トークン ================= */
  :root{
    --bg:#0a0b0d;
    --bg-soft:#101115;
    --panel:#181a21;
    --panel-2:#1e2129;
    --panel-edge:#363b48;
    --hairline:#2c303b;
    --edge-hover:#3a3f4d;
    --ink:#ecebe5;
    --ink-dim:#9a988f;
    --ink-faint:#6c6a63;
    --ember:#ff8a3d;
    --ember-hot:#ffc857;
    --ember-deep:#d4581f;
    --win:143,191,107;        /* 勝利の緑（rgba() で透明度を変えて使う） */
    --team-a:#5b9bd5;
    --team-a-bg:rgba(91,155,213,.08);
    --team-b:#d95f5f;
    --team-b-bg:rgba(217,95,95,.08);
    --jp-font:'Noto Sans JP',sans-serif;
    --num-font:'Chakra Petch',monospace;
    --radius:2px;             /* 角張ったデザイン：箱類の角丸はすべてこの値 */
  }

  /* ================= ベース ================= */
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1100px 480px at 78% -8%,rgba(255,138,61,.10),transparent 60%),
      radial-gradient(900px 500px at -5% 0%,rgba(127,168,201,.06),transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--jp-font);
    font-size:16px;line-height:1.65;min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:var(--jp-font)}
  .wrap{max-width:85%;margin:0 auto;padding:28px 20px 72px}
  *::-webkit-scrollbar{height:10px;width:10px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:var(--panel-edge);border:2px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--edge-hover);background-clip:content-box}

  /* ================= ヘッダー ================= */
  header{position:relative;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--panel-edge);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand-mark{width:42px;height:42px;flex-shrink:0;border-radius:var(--radius);display:grid;place-items:center;font-size:21px;background:linear-gradient(145deg,#23262f,#15171c);border:1px solid var(--panel-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 22px -8px var(--ember)}
  h1{font-weight:900;font-size:29px;letter-spacing:.04em;line-height:1.2}
  .nav-links{display:flex;gap:8px;flex-shrink:0}
  .nav-link{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius);background:var(--ember);color:#15161a;font-size:15px;font-weight:700;text-decoration:none;transition:background .15s,transform .1s}
  .nav-link:hover{background:var(--ember-hot);transform:translateY(-1px)}

  /* ================= 統計期間 ================= */
  .period-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:-8px 0 20px}
  .period-bar .period-label{font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);margin:0}
  .period-bar .period-date{font-family:var(--num-font);font-size:15px;font-weight:700;color:var(--ink);min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
  /* 2つのつまみで範囲を選ぶスライダー（range を2本重ね、つまみだけクリックを受ける） */
  .range{--thumb:18px;position:relative;flex:1 1 280px;min-width:180px;max-width:560px;height:30px}
  .range-rail{position:absolute;left:calc(var(--thumb)/2);right:calc(var(--thumb)/2);top:50%;height:4px;margin-top:-2px;background:var(--panel-edge);border-radius:2px}
  .range-fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--ember-deep),var(--ember),var(--ember-hot));box-shadow:0 0 10px -2px var(--ember)}
  .range-tick{position:absolute;top:50%;width:2px;height:8px;margin:-4px 0 0 -1px;background:var(--edge-hover)}
  .range-tick.on{background:rgba(26,19,12,.55)}
  .range input{position:absolute;inset:0;width:100%;height:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .range input:focus{outline:none}
  .range input::-webkit-slider-runnable-track{background:none;border:none}
  .range input::-moz-range-track{background:none;border:none}
  .range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:var(--thumb);height:var(--thumb);border-radius:50%;background:var(--ember-hot);border:3px solid #1a130c;box-shadow:0 0 0 1px var(--ember),0 0 12px -2px var(--ember);cursor:grab;transition:transform .1s}
  .range input::-moz-range-thumb{pointer-events:auto;width:var(--thumb);height:var(--thumb);box-sizing:border-box;border-radius:50%;background:var(--ember-hot);border:3px solid #1a130c;box-shadow:0 0 0 1px var(--ember),0 0 12px -2px var(--ember);cursor:grab}
  .range input:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.15)}
  .range input:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ember-hot);outline-offset:2px}
  .range input:focus-visible::-moz-range-thumb{outline:2px solid var(--ember-hot);outline-offset:2px}
  .range input:disabled::-webkit-slider-thumb{opacity:.4;cursor:default}
  .period-reset{appearance:none;background:transparent;color:var(--ember);border:1px solid var(--ember);border-radius:var(--radius);padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:color .15s,background .15s}
  .period-reset:hover{background:var(--ember);color:#1a130c}
  .period-reset:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}
  .period-reset:disabled{border-color:var(--panel-edge);color:var(--ink-faint);background:transparent;cursor:default}
  /* 狭い画面：日付を1行目に並べ、スライダーは2行目に全幅で */
  @media (max-width:640px){
    .period-bar{gap:8px 10px}
    .period-bar .period-date{min-width:0}
    #period-to-label::before{content:'〜';margin-right:8px;color:var(--ink-dim)}
    .range{order:9;flex:1 1 100%;max-width:none}
  }
  .period-bar .period-count{font-size:13px;color:var(--ink-dim);letter-spacing:.04em}
  .period-bar .period-count b{font-family:var(--num-font);color:var(--ember-hot);margin:0 2px}

  /* ================= タブ / パネル / レイアウト ================= */
  .tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:var(--radius);padding:4px}
  .tabs button{flex:1;appearance:none;background:transparent;color:var(--ink-dim);border:none;border-radius:var(--radius);padding:10px 24px;font-size:16px;font-weight:600;cursor:pointer;transition:color .15s,background .15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.active{color:#1a130c;background:linear-gradient(160deg,var(--ember-hot),var(--ember));box-shadow:0 6px 18px -8px var(--ember)}
  .tabs button:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}

  .panel{background:linear-gradient(180deg,var(--panel),var(--bg-soft));border:1px solid var(--panel-edge);border-radius:var(--radius);padding:28px;box-shadow:0 24px 60px -40px rgba(0,0,0,.9)}
  .row{display:flex;flex-wrap:wrap;gap:32px}
  .col{flex:1 1 380px;min-width:0}

  label{display:block;font-size:13px;color:var(--ink-dim);letter-spacing:.1em;margin-bottom:7px}

  /* 見出し（左にアクセントバー） */
  h2{font-size:14px;font-weight:700;letter-spacing:.06em;margin:18px 0 10px;display:flex;align-items:center;gap:9px}
  h2::before{content:'';width:3px;height:14px;background:linear-gradient(var(--ember),var(--ember-deep));box-shadow:0 0 10px -2px var(--ember)}
  .col > h2:first-child{margin-top:0}
  /* 見出し + トグルの横並び */
  .h2-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
  .h2-row h2{margin:0}
  .col > .h2-row:first-child{margin-top:0}
  .click-hint{font-size:12px;font-weight:500;color:var(--ember);letter-spacing:.06em;opacity:.85;margin-left:4px}

  /* ================= トグル ================= */
  .toggle{display:inline-flex;border:1px solid var(--panel-edge);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
  .toggle button{background:transparent;color:var(--ink-dim);border:none;border-right:1px solid var(--panel-edge);padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:color .15s,background .15s}
  .toggle button:last-child{border-right:none}
  .toggle button:hover{color:var(--ink)}
  .toggle button.active{background:linear-gradient(160deg,var(--ember-hot),var(--ember));color:#1a130c;font-weight:700}
  .toggle button:focus-visible{outline:2px solid var(--ember-hot);outline-offset:-2px}
  .toggle-sm button{padding:7px 13px;font-size:14px}

  /* ================= テーブル ================= */
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{position:sticky;top:0;text-align:left;color:var(--ink-dim);font-weight:600;font-size:12px;letter-spacing:.05em;background:var(--panel);border-bottom:1px solid var(--panel-edge);padding:9px 10px}
  th.sortable{cursor:pointer;user-select:none;transition:color .15s,background .15s}
  th.sortable:hover{color:var(--ember-hot);background:rgba(255,138,61,.08)}
  th.sortable.sort-active{color:var(--ember-hot);background:rgba(255,138,61,.12)}
  td{border-bottom:1px solid var(--hairline);padding:10px 12px}
  tbody tr:hover td{background:rgba(255,255,255,.022)}
  td.num,th.num{text-align:right;font-family:var(--num-font);font-weight:600;font-variant-numeric:tabular-nums}
  td.empty{color:var(--ink-faint)}
  td.no-record{text-align:center;font-family:var(--jp-font);font-weight:500;font-size:13px}
  /* 大きさバー付き数値セル（--w: 幅%、--f: 0〜1 の割合、--bar: バー色） */
  td.bar{position:relative;isolation:isolate}
  td.bar::before{content:'';position:absolute;left:8px;top:5px;bottom:5px;width:var(--w,0);max-width:calc(100% - 16px);background:var(--bar,rgba(255,138,61,.32));z-index:-1}
  td.bar span{position:relative}
  /* 枠付きテーブル。overflow:clip で角の外にはみ出す行背景を切る（hidden と違いスクロールコンテナを作らないので sticky 見出しは維持） */
  .table-box{overflow:clip;border:1px solid var(--hairline);border-radius:var(--radius)}
  .table-box td:first-child,.table-box th:first-child{padding-left:14px}
  .table-box td:last-child,.table-box th:last-child{padding-right:14px}

  .kit-chip{display:inline-block;width:11px;height:11px;margin-right:8px;box-shadow:0 0 8px -1px currentColor}
  .badge{display:inline-block;font-size:11px;font-family:var(--num-font);font-weight:700;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .badge-win{background:rgba(var(--win),.2);color:rgb(var(--win))}
  .badge-lose{background:rgba(224,112,112,.15);color:#e07070}
  .badge-first{background:rgba(255,200,87,.18);color:var(--ember-hot);font-family:var(--jp-font);font-size:12px;margin-left:0}

  /* ================= チャート ================= */
  .chart-box{background:var(--bg-soft);border:1px solid var(--hairline);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .chart-box.wide{margin-bottom:24px}
  .chart-box.scroll{overflow-y:auto}

  /* ================= キットタブ ================= */
  /* キット一覧表：キット名 15%・残り3列を等分。バーは数字の左側に収め、彩度を少し落とす */
  .kit-list{margin-bottom:24px}
  #table-kits{table-layout:fixed;font-size:16.5px}
  #table-kits th,#table-kits td{padding-left:20px;padding-right:20px}
  #table-kits th{width:calc(85% / 3);font-size:13.5px;border-bottom:2px solid #565d6e}
  #table-kits th:first-child{width:15%}
  #table-kits th + th,#table-kits td + td{border-left:1px solid var(--panel-edge)}
  #table-kits td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #table-kits td.bar::before{top:13px;bottom:13px;left:16px;width:calc((100% - 104px) * var(--f,0));max-width:none;filter:saturate(.8)}
  #table-kits tr.kit-row{cursor:pointer}
  #table-kits tr.selected td{background:rgba(255,138,61,.10)}
  #table-kits tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--ember)}

  /* 選択キット詳細ヘッダー */
  .kit-detail-header{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:18px 22px;background:var(--panel-2);border:1px solid var(--panel-edge);border-radius:var(--radius)}
  .kit-detail-header .kit-chip-lg{width:20px;height:20px;flex-shrink:0;box-shadow:0 0 16px -2px currentColor}
  .kit-detail-header .kit-detail-label{font-size:23px;font-weight:900;letter-spacing:.04em;line-height:1.1}
  .kit-detail-header .kit-detail-name{font-family:var(--num-font);font-size:14px;font-weight:600;color:var(--ember);letter-spacing:.1em;margin-top:4px;text-transform:uppercase}

  /* 総ピック・総勝利（アビリティ別グラフの左に大きく） */
  .kit-totals{flex:0 1 260px;display:flex;flex-direction:column;gap:14px}
  .kit-totals .pstat{flex:1;justify-content:center;padding:22px 24px}
  .kit-totals .pv{font-size:56px}
  .kit-totals .pk{font-size:14px}
  .kit-totals .psub{font-size:14px}
  @media (max-width:700px){ .kit-totals{flex:1 1 100%;flex-direction:row} .kit-totals .pv{font-size:40px} }

  /* 使用プレイヤー / キット相性 / 習熟カーブ */
  .sub-row{margin-top:28px}
  /* 開閉ボタン（h2 の中に置き、見た目は見出しのまま） */
  .collapse-btn{appearance:none;background:none;border:none;padding:0;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:color .15s}
  .collapse-btn:hover{color:var(--ember-hot)}
  .collapse-btn:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}
  .collapse-btn .chev{font-size:10px;color:var(--ink-dim);transition:transform .15s}
  .collapse-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .sub-row.collapsed .toggle,.sub-row.collapsed .click-hint{display:none}

  /* 全キット比較 */
  .compare-row{margin-top:32px;padding-top:24px;border-top:1px solid var(--hairline)}

  /* ================= アイテムタブ ================= */
  .item-list{margin:14px 0 24px}
  .item-kit-filter{flex-wrap:wrap;margin-top:12px}
  .item-kit-filter .kit-chip{width:9px;height:9px;margin-right:6px}
  #table-items tr.item-row{cursor:pointer}
  #table-items tr.selected td{background:rgba(255,138,61,.10)}
  #table-items tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--ember)}
  #table-items .item-kits{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
  #table-items .item-kits span{white-space:nowrap}
  #table-items td.low-sample{opacity:.45}
  #table-items td.pos{color:rgb(var(--win))}
  #table-items td.neg{color:#e07070}
  #table-items .item-sub{font-size:11px;color:var(--ink-dim);margin-left:6px}
  .item-detail-sub{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:13px;color:var(--ink-dim)}
  .item-detail-sub b.pos{color:rgb(var(--win))}
  .item-detail-sub b.neg{color:#e07070}
  .item-detail-sub b.low-sample{opacity:.45}
  .item-detail-sub span[title]{cursor:help}
  .item-detail-sub b{font-family:var(--num-font);font-size:16px;font-weight:700;color:var(--ink);margin-left:6px}
  /* 購入時刻の分布：数直線上に購入1件を1つの点（キット色）で置き、同じ位置は上に積む */
  .dot-strip .ds-dot{position:absolute;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
  .dot-strip .ds-avg{position:absolute;width:0;border-left:1px dashed var(--ember-hot)}
  .dot-strip .ds-avg-label{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ember-hot);white-space:nowrap}
  .dot-strip .ds-avg-label b{font-family:var(--num-font);margin-left:4px}

  /* ================= 試合タブ ================= */
  /* 勝利チームを緑のエリアで囲う */
  .team-col{padding:14px;border:1px solid transparent;border-radius:var(--radius);transition:background .2s,border-color .2s,box-shadow .2s}
  .team-col.won{background:rgba(var(--win),.05);border-color:rgba(var(--win),.35);box-shadow:0 12px 30px -22px rgba(var(--win),.45)}
  .team-col.won .table-box{border-color:rgba(var(--win),.22)}
  #h2-team-a{color:var(--team-a)}
  #h2-team-b{color:var(--team-b)}
  #h2-team-a::before{background:var(--team-a);box-shadow:0 0 10px -2px var(--team-a)}
  #h2-team-b::before{background:var(--team-b);box-shadow:0 0 10px -2px var(--team-b)}
  tr.team-row td{font-weight:700;padding-top:15px;border-bottom:1px solid var(--panel-edge)}
  tr.team-row{cursor:pointer}
  tbody tr.team-row:hover td{background:rgba(255,255,255,.05)}
  tr.team-row.selected td{background:rgba(255,138,61,.12)}
  tr.team-row.selected td:first-child{box-shadow:inset 3px 0 0 var(--ember)}
  tr.team-a td{background:var(--team-a-bg)}
  tr.team-b td{background:var(--team-b-bg)}
  /* 試合タブのプレイヤー詳細の見出し */
  .match-player-head{display:flex;align-items:center;gap:16px;margin:8px 0 6px;padding:16px 22px;background:var(--panel-2);border:1px solid var(--panel-edge);border-radius:var(--radius)}
  .match-player-head .kit-chip-lg{width:18px;height:18px;flex-shrink:0;box-shadow:0 0 16px -2px currentColor}
  .match-player-head .mp-name{font-size:22px;font-weight:900;letter-spacing:.03em;line-height:1.2}
  .match-player-head .mp-name small{font-size:14px;font-weight:700;color:var(--ember);margin-left:10px;letter-spacing:.06em}
  .match-player-head .mp-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:13px;color:var(--ink-dim)}
  .match-player-head .mp-stats b{font-family:var(--num-font);font-size:16px;font-weight:700;color:var(--ink);margin-left:6px}
  .match-player-head .mp-stats .na{font-size:13px;font-family:var(--jp-font);font-weight:500;color:var(--ink-faint)}
  #match-items-title{margin-top:24px}
  /* 購入アイテム：0:00〜試合時間の数直線上に、購入した時刻の位置で並べる。
   * ラベルは重ならないよう軸の上下の段に振り分ける（段の高さ・位置は JS で決める） */
  .timeline{position:relative;background:var(--bg-soft);border:1px solid var(--hairline);border-radius:var(--radius);padding:0 28px}
  .timeline .tl-inner{position:relative}
  .timeline .tl-axis{position:absolute;left:0;right:0;height:2px;background:var(--panel-edge)}
  .timeline .tl-tick{position:absolute;width:1px;height:7px;background:var(--edge-hover)}
  .timeline .tl-tick-label{position:absolute;transform:translateX(-50%);font-family:var(--num-font);font-size:11px;color:var(--ink-faint);white-space:nowrap}
  .timeline .tl-end{position:absolute;transform:translateX(-100%);font-family:var(--num-font);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
  .timeline .tl-end small{font-family:var(--jp-font);font-size:10px;font-weight:500;color:var(--ink-dim);margin-left:4px}
  .timeline .tl-end-mark{position:absolute;width:2px;height:14px;background:var(--ink-dim)}
  .timeline .tl-dot{position:absolute;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--ember-hot);box-shadow:0 0 8px -1px var(--ember)}
  .timeline .tl-stem{position:absolute;width:1px;background:rgba(255,138,61,.45)}
  .timeline .tl-label{position:absolute;white-space:nowrap;text-align:center;line-height:1.25;font-size:13px;font-weight:600;padding:3px 7px;
    background:var(--panel-2);border:1px solid var(--panel-edge);border-radius:var(--radius)}
  .timeline .tl-label .tl-time{display:block;font-family:var(--num-font);font-size:11px;font-weight:600;color:var(--ember-hot)}
  .timeline .item-sub{display:block;font-size:10px;font-weight:500;color:var(--ink-dim)}
  .timeline.empty{padding:14px 16px;color:var(--ink-faint);font-size:14px}

  /* ================= カード列（試合・プレイヤー選択、横スクロール） ================= */
  .card-strip{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 14px;margin-bottom:16px;cursor:grab;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:auto;scrollbar-color:var(--ember) var(--panel-edge)}
  .card-strip.dragging{cursor:grabbing;user-select:none;scroll-snap-type:none;scroll-behavior:auto}
  .card-strip.dragging .card{pointer-events:none}
  .card-strip::-webkit-scrollbar{height:12px}
  .card-strip::-webkit-scrollbar-track{background:var(--panel-edge)}
  .card-strip::-webkit-scrollbar-thumb{background:var(--ember);border:2px solid var(--panel-edge);background-clip:padding-box}
  .card-strip::-webkit-scrollbar-thumb:hover{background:var(--ember-hot);background-clip:padding-box}
  .card{flex:0 0 auto;min-width:210px;scroll-snap-align:start;text-align:left;cursor:pointer;
    background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--panel-edge);border-radius:var(--radius);padding:12px 14px;
    color:var(--ink);display:flex;flex-direction:column;gap:6px;
    transition:border-color .15s,transform .1s,box-shadow .15s}
  .card:hover{border-color:var(--edge-hover);transform:translateY(-1px)}
  .card.active{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 10px 24px -14px var(--ember)}
  .card:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}
  .card .mc-date{font-family:var(--num-font);font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.1}
  .card .mc-date small{font-size:13px;font-weight:600;color:var(--ink-dim);margin-left:6px}
  .card .mc-map{font-size:14px;font-weight:700;color:var(--ember-hot)}
  .card .mc-row{display:flex;gap:12px;font-size:13px;color:var(--ink-dim)}
  .card .mc-row b{font-family:var(--num-font);font-weight:600;color:var(--ink);margin-left:4px}
  .player-strip .card{min-width:150px;padding:10px 12px;gap:5px}
  .player-strip .mc-row{gap:8px}
  .card .pc-name{font-family:var(--num-font);font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.1;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .pc-name.uuid{font-size:12px;color:var(--ink-dim);font-weight:600}

  /* ================= プレイヤータブ：統計カード ================= */
  .pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
  .pstat{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--panel-edge);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:5px}
  .pstat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ember),var(--ember-deep))}
  .pstat .pk{font-size:13px;color:var(--ink-dim);letter-spacing:.1em}
  .pstat .pv{font-family:var(--num-font);font-size:29px;font-weight:700;color:var(--ember-hot);line-height:1.1}
  .pstat .psub{font-size:13px;color:var(--ink-dim)}
  .pstat.kit-card .pv{font-size:21px;display:flex;align-items:center;gap:8px;color:var(--ink)}

  /* ================= 読み込み中 / エラー / 名前取得状況 ================= */
  .data-loading{display:flex;flex-direction:column;gap:12px;padding:20px 0}
  .skel{background:linear-gradient(90deg,var(--panel-edge) 25%,var(--panel-2) 50%,var(--panel-edge) 75%);background-size:200% 100%;border-radius:var(--radius);animation:shimmer 1.4s infinite}
  .skel-chart{height:220px}
  .skel-table{height:140px}
  .skel-cards{height:80px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .error{text-align:center;padding:20px;color:#e88a8a;font-family:var(--num-font);letter-spacing:.18em;font-size:14px}
  #name-status{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;padding:12px 4px 0;min-height:20px;text-align:right}

  @media (max-width:640px){
    .wrap{padding:18px 14px 56px}
    h1{font-size:20px}
    .panel{padding:16px}
    .tabs button{padding:9px 8px}
    .kit-detail-header{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🔥</div>
      <h1>フォージウォーズ　統計サイト</h1>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="https://reyonjp.github.io/mypage/" target="_blank">ホーム</a>
      <a class="nav-link" href="https://reyonjp.github.io/wiki/" target="_blank">Wiki</a>
    </nav>
  </header>

  <!-- 統計期間（試合のあった日付から開始日・終了日を選ぶ） -->
  <div class="period-bar" role="group" aria-label="統計期間">
    <span class="period-label">統計期間</span>
    <span class="period-date" id="period-from-label">—</span>
    <div class="range">
      <div class="range-rail" id="period-rail"><div class="range-fill" id="period-fill"></div></div>
      <input type="range" id="period-from" aria-label="開始日" min="0" max="0" step="1" value="0" disabled
             oninput="onPeriodInput()" onchange="commitPeriod()">
      <input type="range" id="period-to" aria-label="終了日" min="0" max="0" step="1" value="0" disabled
             oninput="onPeriodInput()" onchange="commitPeriod()">
    </div>
    <span class="period-date" id="period-to-label">—</span>
    <button type="button" class="period-reset" id="period-reset" onclick="resetPeriod()" disabled>全期間に戻す</button>
    <span class="period-count" id="period-count"></span>
  </div>

  <div class="tabs" role="tablist">
    <button id="tab-kit" class="active" onclick="switchTab('kit')">キット</button>
    <button id="tab-item" onclick="switchTab('item')">アイテム</button>
    <button id="tab-match" onclick="switchTab('match')">試合</button>
    <button id="tab-player" onclick="switchTab('player')">プレイヤー</button>
  </div>

  <!-- ===== キットタブ ===== -->
  <div class="panel" id="view-kit">
    <!-- キット一覧表 -->
    <div class="kit-list">
      <div class="table-box"><table id="table-kits"></table></div>
    </div>

    <!-- 選択キット詳細ヘッダー -->
    <div class="kit-detail-header" id="kit-detail-header">
      <span class="kit-chip-lg" id="kit-detail-chip"></span>
      <div>
        <div class="kit-detail-label">キット詳細</div>
        <div class="kit-detail-name" id="kit-detail-name">—</div>
      </div>
    </div>

    <div id="kit-skeleton" class="data-loading">
      <div class="skel skel-chart"></div>
      <div class="skel skel-table"></div>
    </div>
    <div id="kit-content" style="display:none">
      <!-- 総ピック・総勝利 + アビリティ別 -->
      <div class="row">
        <div class="kit-totals" id="kit-totals"></div>
        <div class="col">
          <div class="h2-row">
            <h2 id="h2-kit-chart">アビリティ別 毎分ダメージ</h2>
            <div class="toggle" id="kit-mode-toggle" role="group" aria-label="アビリティ表示モード">
              <button data-value="perMin" class="active" onclick="setKitMode(this.dataset.value)">毎分ダメージ</button>
              <button data-value="ratio" onclick="setKitMode(this.dataset.value)">通常攻撃比</button>
            </div>
          </div>
          <div class="chart-box"><canvas id="chart-kit-ability"></canvas></div>
        </div>
      </div>

      <!-- 使用プレイヤー / キット相性 / 習熟カーブ（3つから選択。見出しクリックで開閉、最初は閉じている） -->
      <div class="h2-row sub-row collapsed" id="kit-sub-row">
        <h2><button type="button" class="collapse-btn" id="kit-sub-collapse" aria-expanded="false" aria-controls="kit-sub-body" onclick="toggleKitSubOpen()">
          <span class="chev" aria-hidden="true">▶</span><span id="h2-kit-sub"></span>
        </button></h2>
        <div class="toggle toggle-sm" id="kit-sub-toggle" role="group" aria-label="キット詳細の表示">
          <button data-value="players" class="active" onclick="setKitSub(this.dataset.value)">使用プレイヤー</button>
          <button data-value="matchup" onclick="setKitSub(this.dataset.value)">苦手・得意キット</button>
          <button data-value="learning" onclick="setKitSub(this.dataset.value)">習熟カーブ</button>
        </div>
        <span class="click-hint" id="kit-sub-hint"></span>
      </div>
      <div id="kit-sub-body" hidden>
      <div id="kit-sub-players">
        <div class="table-box"><table id="table-kit-players"></table></div>
      </div>
      <div id="kit-sub-matchup" class="row" style="display:none">
        <div class="col">
          <h2>苦手な敵キット <span class="click-hint">敵にいた時の勝率 低い順</span></h2>
          <div class="table-box"><table id="table-kit-enemy"></table></div>
        </div>
        <div class="col">
          <h2>相性の良い味方キット <span class="click-hint">味方にいた時の勝率 高い順</span></h2>
          <div class="table-box"><table id="table-kit-ally"></table></div>
        </div>
      </div>
      <div id="kit-sub-learning" style="display:none">
        <div class="chart-box" style="height:340px"><canvas id="chart-kit-learning"></canvas></div>
      </div>
      </div>

      <!-- 全キット比較（3つから選択） -->
      <div class="h2-row compare-row">
        <h2>全キット比較</h2>
        <div class="toggle toggle-sm" id="kit-view-toggle" role="group" aria-label="全キット比較の表示">
          <button data-value="pickWin" class="active" onclick="setKitView(this.dataset.value)">ピック率 × 勝率</button>
          <button data-value="dmgWin" onclick="setKitView(this.dataset.value)">毎分ダメージ × 勝率</button>
          <button data-value="abilityRank" onclick="setKitView(this.dataset.value)">ダメージソース</button>
        </div>
        <span class="click-hint" id="kit-compare-hint"></span>
      </div>
      <div class="chart-box" id="kit-scatter-box"><canvas id="chart-kit-scatter"></canvas></div>
      <div class="chart-box scroll" id="ability-rank-box" style="display:none"><div><canvas id="chart-ability-rank"></canvas></div></div>
    </div>
  </div>

  <!-- ===== アイテムタブ ===== -->
  <div class="panel" id="view-item" style="display:none">
    <div id="item-skeleton" class="data-loading">
      <div class="skel skel-table"></div>
      <div class="skel skel-chart"></div>
    </div>
    <div id="item-content" style="display:none">
      <div class="h2-row" style="margin-top:0">
        <div class="toggle" id="item-kind-toggle" role="group" aria-label="アイテムの種類">
          <button data-value="common" class="active" onclick="setItemKind(this.dataset.value)">共通アイテム</button>
          <button data-value="upgrade" onclick="setItemKind(this.dataset.value)">キット専用</button>
        </div>
        <span class="click-hint" id="item-hint"></span>
      </div>
      <!-- アップグレードのキット絞り込み（アップグレード表示のときだけ） -->
      <div class="toggle toggle-sm item-kit-filter" id="item-kit-filter" role="group" aria-label="キットで絞り込み"></div>
      <!-- アイテム一覧表 -->
      <div class="item-list">
        <div class="table-box"><table id="table-items"></table></div>
      </div>

      <!-- 選択アイテムの詳細 -->
      <div id="item-detail">
        <div class="kit-detail-header" id="item-detail-header">
          <div>
            <div class="kit-detail-label" id="item-detail-name">—</div>
            <div class="item-detail-sub" id="item-detail-sub"></div>
          </div>
        </div>
        <h2>購入時刻の分布</h2>
        <div class="timeline dot-strip" id="item-time-dist"></div>
        <div id="item-kit-section">
          <h2 style="margin-top:24px">キット別 購入率</h2>
          <div class="chart-box"><canvas id="chart-item-kits"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 試合タブ ===== -->
  <div class="panel" id="view-match" style="display:none">
    <label>試合を選択</label>
    <div class="card-strip" id="match-strip" role="listbox" aria-label="試合一覧"></div>
    <div id="match-skeleton" class="data-loading">
      <div class="skel skel-table"></div>
      <div class="skel skel-chart"></div>
    </div>
    <div id="match-content" style="display:none">
      <div class="row">
        <div class="col team-col" id="col-team-a">
          <h2 id="h2-team-a">チーム A</h2>
          <div class="table-box"><table id="table-match-a"></table></div>
        </div>
        <div class="col team-col" id="col-team-b">
          <h2 id="h2-team-b">チーム B</h2>
          <div class="table-box"><table id="table-match-b"></table></div>
        </div>
      </div>
      <h2>プレイヤー別 合計ダメージ <span class="click-hint">クリックでアビリティ詳細</span></h2>
      <div class="chart-box wide"><canvas id="chart-match"></canvas></div>
      <!-- クリックで切り替わるプレイヤー詳細（見出し：名前 / 小見出し：成績 / 項目：アビリティ別ダメージ・購入アイテム） -->
      <div id="match-ability-detail" style="display:none">
        <div class="match-player-head">
          <span class="kit-chip-lg" id="match-player-chip"></span>
          <div>
            <div class="mp-name" id="match-player-name"></div>
            <div class="mp-stats" id="match-player-stats"></div>
          </div>
        </div>
        <h2>アビリティ別ダメージ</h2>
        <div class="table-box"><table id="table-match-ability"></table></div>
        <h2 id="match-items-title">購入アイテム</h2>
        <div class="timeline" id="match-items-timeline"></div>
      </div>
    </div>
  </div>

  <!-- ===== プレイヤータブ ===== -->
  <div class="panel" id="view-player" style="display:none">
    <label>プレイヤーを選択</label>
    <div class="card-strip player-strip" id="player-strip" role="listbox" aria-label="プレイヤー一覧"></div>
    <div id="player-skeleton" class="data-loading">
      <div class="skel skel-cards"></div>
      <div class="skel skel-chart"></div>
    </div>
    <div id="player-content" style="display:none">
      <div class="pstats" id="player-stats"></div>
      <div class="row">
        <div class="col">
          <h2>キット別 毎分平均ダメージ</h2>
          <div class="chart-box"><canvas id="chart-player"></canvas></div>
        </div>
        <div class="col">
          <h2>キット別 成績</h2>
          <div class="table-box"><table id="table-player"></table></div>
        </div>
      </div>
    </div>
  </div>

  <div id="name-status"></div>
</div>

<script>
/* ================================================================
 *  フォージウォーズ 統計サイト — フロントエンド
 *
 *  構成
 *    1. 設定・定数
 *    2. 状態
 *    3. 汎用ユーティリティ（整形・集計・HTML 部品・UI 同期）
 *    4. データ派生（state.picks / state.rows からの集計）
 *    5. チャート
 *    6. 描画：キット / 試合 / プレイヤー
 *    7. 名前解決（Mojang）
 *    8. 起動
 * ================================================================ */

/* ---------- 1. 設定・定数 ---------- */
const LAMBDA_URL = 'https://2gcjv7f3gcqrygc4ya6gt4z4au0ojrlv.lambda-url.ap-northeast-1.on.aws/';

// キット色（#rrggbb。透明度を末尾に付けて使うので短縮形不可）
const KIT_COLOR = {
  'カルティスト':   '#b07ce8',   // 紫
  'レヴィン':       '#f2d544',   // 黄
  'スウィフト':     '#5fd0e8',   // 水色
  'リジッド':       '#7cc46a',   // 緑
  'デストロイヤー': '#e5534b',   // 赤
  'ガイザー':       '#3f7fe0',   // 青
  'ヘイル':         '#d9e6ee',   // 氷（白）
  'グリード':       '#f0913a',   // 橙
  'ネクター':       '#ec7fb6',   // ピンク
  'プラトー':       '#b58955',   // 茶
  'ガーディアン':   '#3fae95',   // 青緑
};
// キット専用アイテム（キット → そのキットだけが買えるアイテムの表示名）。
// ゲームのソース（ForgeWarsManager/Kit/*）の EnchantUpgradeAbility / EnchantUpgradeUltimateAbility / EnchantType.KIT_ONLY が正。
// アップグレードの名前は「アビリティ名 + " アップグレード"」。キットやアップグレードが変わったらここも直す
const UP = name => name+' アップグレード';
const KIT_ITEMS = {
  'カルティスト':   [UP('スケアリーヘッド'), UP('ダークパクト'), UP('アルティメット・サクリファイス')],
  'デストロイヤー': [UP('デトネーション'), UP('ハイマイス'), UP('ホットバースト')],
  'ガイザー':       [UP('波乗り'), UP('ハイドロインパクト'), UP('ポセイドン・トライデント')],
  'グリード':       [UP('オブセッション'), UP('エンレイジ'), UP('サンダリング')],
  'ガーディアン':   [UP('チャージバッシュ'), UP('守護領域'), 'サーマルアーマー'],
  'ヘイル':         [UP('アイスレーザー'), UP('シャープボール'), UP('フロストノヴァ')],
  'レヴィン':       [UP('アークテザー'), UP('エレキウェブ'), UP('ブレイクダウン')],
  'ネクター':       [UP('スネアブルーム'), UP('ジャイアントポーション')+' A', UP('ジャイアントポーション')+' B'],
  'プラトー':       [UP('キャンプファイア'), UP('レッドギフト'), UP('シエラ')],
  'リジッド':       [UP('ハードクラッシュ'), UP('ロアリング'), UP('アイアングリップ')],
  'スウィフト':     [UP('オーバードライブ'), UP('アクセル'), UP('ネイルチャージ')],
};
const KIT_OF_ITEM = Object.fromEntries(Object.entries(KIT_ITEMS).flatMap(([kit,list])=>list.map(n=>[n,kit])));
// KIT_COLOR にない（新しく追加された）キット用
const FALLBACK_KIT_COLORS = ['#c9c28a','#8f7fd6','#d6a0a0','#9fc9b8','#c7a5e0'];
const TEAM_COLOR = { A:'#5b9bd5', B:'#d95f5f' };
const SHARED_ABILITY_COLOR = '#8a8f99';   // 複数キットが持つアビリティ（通常攻撃など）の色。キット色と被らない灰色
const CHART_THEME = {
  tick:'#9a988f', grid:'rgba(255,255,255,.07)', label:'#cfcdc6',
  font:'Chakra Petch',
  tooltip:{ bg:'#1e2129', border:'#2b2f3a', text:'#ecebe5' },
};
const TABS = ['kit','item','match','player'];
const NAME_BATCH = 10;
const BASIC_ATTACK = '通常攻撃';   // 通常攻撃比の基準アビリティ（データ上の生の名前）

/* ---------- 2. 状態 ---------- */
const state = {
  tab: 'kit',         // 表示中のタブ（TABS の値）
  all: null,          // 全期間のデータ { matches, picks, rows }（buildTables の結果）
  dates: [],          // 試合のあった日付（昇順、'YYYY/MM/DD' 等の日付部分）
  matchDates: [],     // 出場者のいる試合それぞれの日付（期間スライダーの試合数表示用）
  period: { from:null, to:null },   // 統計期間（dates の値。両端を含む）
  matches: new Map(), // 試合ID → { id, date, duration, map, winTeam }
  picks: [],          // 出場（試合×プレイヤー）。ダメージ0でも含む。{ matchId, playerId, kit, team, kills, deaths, won, date, duration, map }
  rows: [],           // ダメージ記録（試合×プレイヤー×アビリティ）。picks の項目に ability・damage を足したもの
  names: {},          // UUID → Minecraft 表示名
  kitColors: {},      // キット名 → 色
  charts: {},         // canvasId → Chart インスタンス
  suppressAnim: false,

  // 期間内のデータに依存する集計（applyPeriod で計算し直す）
  kitStats: null,     // 全キット統計（derive.kitStats）
  abilityRank: [],    // キット横断のダメージソース順位（derive.abilityRanking）
  allKits: [],        // 全期間に登場したキット（期間によらずキット表に並べる）
  kitUseNth: {},      // kitUseKey(プレイヤー, キット, 試合) → そのキットの何回目の使用か（期間によらず全期間で数える）
  matchups: {},       // キット → { enemy, ally }（derive.kitMatchups）
  itemStats: null,    // アイテム別の購入統計（derive.itemStats）

  kit: {
    current: null,        // 選択中のキット
    listSort: 'pickRate', // キット一覧表のソート列：'name'|'pickRate'|'winRate'|'perMin'
    mode: 'perMin',       // アビリティ別グラフ：'perMin'|'ratio'
    sub: 'players',       // 詳細の表示：'players'|'matchup'|'learning'
    subOpen: false,       // 詳細（使用プレイヤー等）を開いているか。最初は閉じている
    sort: 'avgDmg',       // 使用プレイヤー表のソート列：'count'|'winRate'|'avgDmg'
    view: 'pickWin',      // 全キット比較：'pickWin'|'dmgWin'|'abilityRank'
  },
  item:   { current:null, kind:'common', sort:'rate', kit:null },   // current: 選択中のアイテム名 / kind: 'common'|'upgrade' / sort: 'name'|'kit'|'rate'|'time'|'contrib' / kit: アップグレードの絞り込みキット（null=すべて）
  match:  { current:null, selected:null, model:null },  // current: 表示中の試合ID / selected: { matchId, pid } 詳細を出しているプレイヤー / model: 表示中の試合の derive.matchPlayers
  player: { current:null, sort:'uses' },    // current: 表示中のプレイヤーID / sort: 'uses'|'winRate'|'perMin'
};

/* ---------- 3. 汎用ユーティリティ ---------- */
const $ = id => document.getElementById(id);

const fmtInt      = n => Math.round(n).toLocaleString('ja-JP');
const pct         = n => (n*100).toFixed(1)+'%';        // 0-1 スケール
const pctFromUnit = v => v.toFixed(1)+'%';              // 0-100 スケール（チャート用）
const fmtRatio    = v => '×'+v.toFixed(2);
const fmtClock    = s => { if(s==null) return '-'; const r=Math.round(s); return `${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`; };   // 先に秒へ丸める（179.5 → 3:00）
const disp        = uuid => state.names[uuid] || uuid;
const esc         = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const maxOf       = arr => arr.length ? Math.max(...arr) : 0;
const uniq        = arr => [...new Set(arr)];
const byDesc      = fn => (a,b) => fn(b)-fn(a);
const sleep       = ms => new Promise(r=>setTimeout(r,ms));

// アビリティ名の表示用整形（"_Damage" 除去・アンダースコアを空白に）。ロジックは必ず生の名前を使う。
function prettyAbility(name){
  const s=String(name).replace(/_?[Dd]amage/g,'').replace(/_+/g,' ').replace(/\s+/g,' ').trim();
  return s || String(name);
}

// 試合日時（'YYYY-MM-DD hh:mm:ss' 等）の日付部分
const dateOf = date => String(date).split(/\s+/)[0] || '';

// 「1ピック」＝ 試合×プレイヤー のキー
const pickKey = r => r.matchId+'|'+r.playerId;
// キット使用回数の参照キー（derive.kitUseNth と対応）
const kitUseKey = (pid, kit, matchId) => pid+'|'+kit+'|'+matchId;

/* 毎分ダメージ集計
 * 試合時間のある試合だけを対象に「合計ダメージ ÷ 合計試合時間(分)」を出す。
 * 試合ごとに長さが違うため、ピック平均ではなく総量どうしの比で求める。
 * 分母はピック（addPick：1ピック1回）、分子はダメージ記録（addDamage）から足すので、
 * ダメージ0のピックも分母に入る。 */
const perMin = {
  create: () => ({ dmg:0, minutes:0 }),
  addPick(acc, p){ if(p.duration > 0) acc.minutes += p.duration/60; },   // 時間データのない試合は除外（通常は Lambda 側で除外済み）
  addDamage(acc, r){ if(r.duration > 0) acc.dmg += r.damage; },
  value: acc => acc.minutes > 0 ? acc.dmg/acc.minutes : null,
};

/* ---------- 4. データ派生 ----------
 * picks：出場（試合×プレイヤー）… ピック数・勝率・試合数・毎分ダメージの分母
 * rows ：ダメージ記録            … ダメージ系の集計の分子
 * ダメージ0の出場は rows に現れないので、出場に関わる数は必ず picks から数える */

// Lambda GET の応答（matches / players / damage / items）から state.matches / picks / rows と購入履歴を組み立てる
function buildTables({ matches, players, damage, items = [] }){
  const matchMap=new Map(matches.map(m=>[m.id, m]));
  const pickByKey=new Map();
  const picks=[];
  players.forEach(p=>{
    const m=matchMap.get(p.matchId);
    if(!m) return;
    const pick={ ...p, won: m.winTeam!=='' && p.team===m.winTeam, date:m.date, duration:m.duration, map:m.map };
    picks.push(pick);
    pickByKey.set(pickKey(pick), pick);
  });
  const rows=[];
  damage.forEach(d=>{
    const p=pickByKey.get(pickKey(d));
    if(p) rows.push({ ...p, ability:d.ability, damage:d.damage });
  });
  // 購入履歴：pickKey → [{ time, item }]（時刻順）。記録のある試合 ID も持つ（記録なし／購入なしの区別用）
  const purchases=new Map(), purchaseMatches=new Set();
  items.forEach(it=>{
    if(!pickByKey.has(pickKey(it))) return;
    purchaseMatches.add(it.matchId);
    let list=purchases.get(pickKey(it));
    if(!list) purchases.set(pickKey(it), list=[]);
    list.push({ time:+it.time, item:it.item });
  });
  purchases.forEach(list=>list.sort((a,b)=>a.time-b.time));
  const itemNames=new Set([...purchases.values()].flat().map(b=>b.item));   // URL の #item= の確認用
  return { matches:matchMap, picks, rows, purchases, purchaseMatches, itemNames };
}

const derive = {
  // 全キット統計：ピック率・勝率・毎分ダメージ。kits はピック数の多い順
  // allKits：全期間に登場したキット。期間内にピックがないキットも 0 ピックとして並べる（末尾）
  kitStats(picks, rows, allKits = []){
    const stats={};                // kit → { picks, wins, pm }
    const get = k => stats[k] ??= { picks:0, wins:0, pm:perMin.create() };
    picks.forEach(p=>{
      const s=get(p.kit);
      s.picks++;
      if(p.won) s.wins++;
      perMin.addPick(s.pm, p);
    });
    rows.forEach(r=>perMin.addDamage(get(r.kit).pm, r));
    const totalPicks=picks.length;
    return {
      kits:    uniq([...allKits, ...Object.keys(stats)]).sort(byDesc(k=>stats[k]?.picks ?? 0)),
      picks:   k => stats[k]?.picks ?? 0,
      wins:    k => stats[k]?.wins ?? 0,
      winRate: k => stats[k] ? stats[k].wins/stats[k].picks : null,   // 期間内ピックなしは null
      pickRate:k => totalPicks ? (stats[k]?.picks ?? 0)/totalPicks : 0,
      perMin:  k => stats[k] ? perMin.value(stats[k].pm) : null,
    };
  },

  // プレイヤー×キットごとに使用した試合を日時順に並べ、各試合が何回目の使用かを求める
  kitUseNth(picks){
    const uses={};                 // プレイヤー|キット → その組み合わせのピック一覧
    picks.forEach(p=>{ (uses[p.playerId+'|'+p.kit] ??= []).push(p); });
    const nth={};
    Object.values(uses).forEach(list=>{
      list.sort((a,b)=>String(a.date).localeCompare(String(b.date)) || String(a.matchId).localeCompare(String(b.matchId)))
          .forEach((p,i)=>{ nth[kitUseKey(p.playerId, p.kit, p.matchId)]=i+1; });
    });
    return nth;
  },

  // キットを問わずアビリティ名ごとに毎分ダメージを集計（降順）
  // 分母はそのアビリティでダメージを出したピックの試合時間
  abilityRanking(rows){
    const byAb={};
    rows.forEach(r=>{
      const a = byAb[r.ability] ??= { pm:perMin.create(), picks:new Set(), kits:new Set() };
      perMin.addDamage(a.pm, r);
      if(!a.picks.has(pickKey(r))){ a.picks.add(pickKey(r)); perMin.addPick(a.pm, r); }
      a.kits.add(r.kit);
    });
    return Object.entries(byAb)
      .map(([ability,a])=>({ ability, kits:[...a.kits].sort(), perMin:perMin.value(a.pm) }))
      .filter(a=>a.perMin!=null)
      .sort(byDesc(a=>a.perMin));
  },

  // キット1つ分のアビリティ統計（毎分ダメージ & 通常攻撃比）
  kitAbilities(picks, rows){
    // 毎分：アビリティの合計ダメージ ÷ そのキットの合計試合時間（使わなかった試合・ダメージ0の試合も分母に含める）
    const minutes=picks.reduce((s,p)=>s+(p.duration > 0 ? p.duration/60 : 0), 0);
    const dmg={};                  // ability → 時間データのある試合の合計ダメージ
    rows.forEach(r=>{
      dmg[r.ability] ??= 0;
      if(r.duration > 0) dmg[r.ability] += r.damage;
    });

    // 通常攻撃比：ピックごとに「アビリティ / そのピックの通常攻撃」を出して平均
    const perPick={};
    rows.forEach(r=>{
      const p = perPick[pickKey(r)] ??= {};
      p[r.ability]=(p[r.ability]||0)+r.damage;
    });
    const ratio={};
    Object.values(perPick).forEach(p=>{
      const base=p[BASIC_ATTACK];
      if(!(base > 0)) return;
      Object.entries(p).forEach(([ab,dmg])=>{
        const g = ratio[ab] ??= { sum:0, n:0 };
        g.sum += dmg/base; g.n++;
      });
    });
    const mean = g => g.sum/g.n;
    return {
      abilities:Object.keys(dmg).sort(),
      perMin:a=>minutes>0 ? dmg[a]/minutes : null,
      ratio:a=>ratio[a] ? mean(ratio[a]) : null,
    };
  },

  // キット1つ分のプレイヤー別統計（使用回数・勝率・毎分平均ダメージ）
  kitPlayers(picks, rows){
    const byPlayer={};
    const get = pid => byPlayer[pid] ??= { pid, count:0, wins:0, pm:perMin.create() };
    picks.forEach(p=>{
      const s=get(p.playerId);
      s.count++;
      if(p.won) s.wins++;
      perMin.addPick(s.pm, p);
    });
    rows.forEach(r=>perMin.addDamage(get(r.playerId).pm, r));
    return Object.values(byPlayer).map(p=>({
      pid:    p.pid,
      count:  p.count,
      winRate:p.wins/p.count,
      avgDmg: perMin.value(p.pm) ?? 0,     // 時間データなしは 0 として末尾へ
    }));
  },

  // キット1つ分の習熟カーブ：使用回数の区間ごとの試合数・勝率・毎分ダメージ
  kitLearning(picks, rows, kit){
    const buckets=LEARNING_BUCKETS.map(b=>({ ...b, n:0, wins:0, pm:perMin.create() }));
    const bucketOf=(pid, matchId)=>{
      const nth=state.kitUseNth[kitUseKey(pid, kit, matchId)];
      return buckets.find(b=>nth>=b.from && (b.to==null || nth<=b.to));
    };
    picks.forEach(p=>{
      const b=bucketOf(p.playerId, p.matchId);
      if(!b) return;
      b.n++;
      if(p.won) b.wins++;
      perMin.addPick(b.pm, p);
    });
    rows.forEach(r=>{
      const b=bucketOf(r.playerId, r.matchId);
      if(b) perMin.addDamage(b.pm, r);
    });
    return buckets.map(b=>({
      label:  b.label,
      n:      b.n,
      winRate:b.n ? b.wins/b.n : null,
      perMin: perMin.value(b.pm),
    }));
  },

  // キット相性：キットごとに、敵／味方に各キットがいた試合での勝敗数
  // 戻り値 kit → { enemy:{ 相手キット → { n, wins } }, ally:{ … } }（同じ試合に同キットが複数いても1回と数える）
  kitMatchups(picks){
    const byMatch={};              // matchId → その試合のピック一覧
    picks.forEach(p=>{ (byMatch[p.matchId] ??= []).push(p); });
    const res={};
    Object.values(byMatch).forEach(list=>{
      list.forEach(me=>{
        const m = res[me.kit] ??= { enemy:{}, ally:{} };
        const seen={ enemy:new Set(), ally:new Set() };
        list.forEach(o=>{
          if(o===me) return;
          const side = o.team===me.team ? 'ally' : 'enemy';
          if(seen[side].has(o.kit)) return;
          seen[side].add(o.kit);
          const s = m[side][o.kit] ??= { n:0, wins:0 };
          s.n++;
          if(me.won) s.wins++;
        });
      });
    });
    return res;
  },

  // 試合一覧（新しい順）。カード表示用に日付/時刻/マップ/人数/試合時間をまとめる。出場者のいない試合は除く
  matchList(matches, picks){
    const count={};
    picks.forEach(p=>{ count[p.matchId]=(count[p.matchId]||0)+1; });
    return [...matches.values()]
      .filter(m=>count[m.id])
      .map(m=>{
        const [d='', t='']=String(m.date).split(/\s+/);
        return { id:m.id, dateText:d, timeText:t.replace(/:\d{2}$/,''), map:m.map||'-', players:count[m.id], duration:m.duration };
      })
      .sort((a,b)=>String(b.dateText+b.timeText).localeCompare(String(a.dateText+a.timeText)));
  },

  // プレイヤー一覧（名前解決済みを先に、名前順）。カード表示用
  playerList(picks){
    const byId={};
    picks.forEach(p=>{
      const s = byId[p.playerId] ??= { id:p.playerId, matches:0, wins:0 };
      s.matches++;
      if(p.won) s.wins++;
    });
    return Object.values(byId)
      .map(p=>({ id:p.id, name:disp(p.id), matches:p.matches,
                 winRate: p.matches ? p.wins/p.matches : 0 }))
      .sort((a,b)=> (a.name===a.id)-(b.name===b.id) || a.name.localeCompare(b.name,'en',{ sensitivity:'base' }));
  },

  // 試合1つ分のプレイヤー別モデル（合計ダメージ降順）。ダメージ0の出場者も total:0 で含む
  matchPlayers(picks, rows){
    const byPid={};
    picks.forEach(p=>{
      byPid[p.playerId]={ pid:p.playerId, name:disp(p.playerId), kit:p.kit, team:p.team, won:p.won,
                          kills:p.kills, deaths:p.deaths, total:0, abilities:[] };
    });
    rows.forEach(r=>{
      const p=byPid[r.playerId];
      if(!p) return;
      p.total+=r.damage;
      p.abilities.push(r);
    });
    const players=Object.values(byPid).sort(byDesc(p=>p.total));
    return {
      byPid, players,
      hasKD: players.some(p=>p.kills!=null || p.deaths!=null),   // キル・デスが記録されている試合か
      team: t => players.filter(p=>p.team===t),
    };
  },

  // アイテム別の購入統計。購入履歴の記録がある試合の出場だけを母数にする
  //   購入率：共通アイテムは全出場のうち、アップグレードはそのキットの出場のうち、1回以上買った出場の割合
  //   アップグレードかどうかは名前（「◯◯ アップグレード」）で判断し、いちばん多く買ったキットをそのキットとする
  itemStats(picks){
    const recorded=picks.filter(p=>state.all.purchaseMatches.has(p.matchId));
    if(!recorded.length) return { items:[], recordedPicks:0, recordedMatches:0, maxDuration:0 };
    const kitPicks={}, kitWins={}; // キット → 記録のある出場数・その勝利数
    recorded.forEach(p=>{ kitPicks[p.kit]=(kitPicks[p.kit]||0)+1; if(p.won) kitWins[p.kit]=(kitWins[p.kit]||0)+1; });
    const allWins=recorded.filter(p=>p.won).length;
    const byItem={};
    recorded.forEach(p=>{
      const list=state.all.purchases.get(pickKey(p)) ?? [];
      const seen=new Set();
      list.forEach(b=>{
        const it = byItem[b.item] ??= { name:b.item, upgrade:isUpgradeItem(b.item), buys:[], buyerKits:{}, buyerWins:0 };
        it.buys.push({ time:b.time, kit:p.kit, pid:p.playerId, matchId:p.matchId });
        if(!seen.has(b.item)){
          seen.add(b.item);
          it.buyerKits[p.kit]=(it.buyerKits[p.kit]||0)+1;
          if(p.won) it.buyerWins++;
        }
      });
    });
    // まだ誰も買っていないキット専用アイテムも 0 件で並べる
    Object.keys(KIT_OF_ITEM).forEach(n=>{ byItem[n] ??= { name:n, upgrade:true, buys:[], buyerKits:{}, buyerWins:0 }; });
    const items=Object.values(byItem).map(it=>{
      const kits=Object.keys(it.buyerKits).sort(byDesc(k=>it.buyerKits[k]));
      const buyers=kits.reduce((n,k)=>n+it.buyerKits[k], 0);
      const kit = it.upgrade ? (KIT_OF_ITEM[it.name] ?? kits[0]) : null;   // 一覧にない新アイテムは、いちばん多く買ったキット
      const denom = (it.upgrade ? kitPicks[kit] : recorded.length) || 0;
      // 勝率：買った出場 と 買わなかった出場（同じ母数＝共通は全出場・アップグレードはそのキットの出場）
      const groupWins = it.upgrade ? (kitWins[kit]||0) : allWins;
      const nonBuyers = denom-buyers;
      const winRate = buyers ? it.buyerWins/buyers : null;
      const nonWinRate = nonBuyers>0 ? (groupWins-it.buyerWins)/nonBuyers : null;
      return {
        name:it.name, upgrade:it.upgrade, kit, buyers, denom,
        contrib: winRate!=null && nonWinRate!=null ? (winRate-nonWinRate)*100 : null,   // 勝率寄与率(pt) = 買った人の勝率 − 買わなかった人の勝率
        winRate, nonBuyers, nonWinRate,
        lowSample: buyers<ITEM_LOW_SAMPLE || nonBuyers<ITEM_LOW_SAMPLE,   // どちらかが少ないと勝率の比較は参考値
        count:it.buys.length,
        rate: denom ? buyers/denom : null,                                  // そのキットの出場がなければ出せない
        avgTime: it.buys.length ? it.buys.reduce((s,b)=>s+b.time, 0)/it.buys.length : null,
        buys:it.buys,
        byKit: Object.keys(kitPicks).map(k=>({ kit:k, buyers:it.buyerKits[k]||0, picks:kitPicks[k], rate:(it.buyerKits[k]||0)/kitPicks[k] }))
                 .sort((a,b)=>b.rate-a.rate || b.picks-a.picks),
        topKits: kits.slice(0,3),
      };
    });
    const durations=uniq(recorded.map(p=>p.matchId)).map(id=>state.all.matches.get(id)?.duration || 0);
    return { items, recordedPicks:recorded.length, recordedMatches:durations.length, maxDuration:maxOf(durations) };
  },

  // プレイヤー1人分：キット別成績 と 試合単位の集計
  playerProfile(picks, rows){
    const kitStat={};
    const get = k => kitStat[k] ??= { uses:0, wins:0, pm:perMin.create() };
    picks.forEach(p=>{
      const k=get(p.kit);
      k.uses++;
      if(p.won) k.wins++;
      perMin.addPick(k.pm, p);
    });
    rows.forEach(r=>perMin.addDamage(get(r.kit).pm, r));
    const kitRows = Object.entries(kitStat).map(([kit,k])=>({
      kit,
      uses:    k.uses,
      winRate: k.wins/k.uses,
      perMin:  perMin.value(k.pm),
    })).sort(byDesc(k=>k.uses));

    const kitUse={};
    kitRows.forEach(k=>{ kitUse[k.kit]=k.uses; });
    const played=picks.length;
    const topKit=kitRows[0]?.kit;
    return {
      kitRows, played, kitUse, topKit,
      won: picks.filter(p=>p.won).length,
      topKitShare: topKit && played ? kitUse[topKit]/played : 0,
    };
  },
};

Chart.defaults.font.size = 13;   // 目盛り・ツールチップ等の既定サイズ（Chart.js 既定は 12）

const tooltipStyle = () => ({
  backgroundColor:CHART_THEME.tooltip.bg, borderColor:CHART_THEME.tooltip.border, borderWidth:1,
  titleColor:CHART_THEME.tooltip.text, bodyColor:CHART_THEME.tooltip.text, padding:10, cornerRadius:2,
  titleFont:{ family:CHART_THEME.font }, bodyFont:{ family:CHART_THEME.font },
});
const axisStyle = (tickFont = {}) => ({
  ticks:{ color:CHART_THEME.tick, font:{ family:CHART_THEME.font, ...tickFont } },
  grid:{ color:CHART_THEME.grid, drawBorder:false },
});
const axisTitle = text => ({ display:true, text, color:CHART_THEME.label, font:{ family:'Noto Sans JP', size:13, weight:700 } });
const valueLabelFont = () => ({ family:CHART_THEME.font, size:12, weight:600 });
const pointerOnHover = (e,els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; };

// 選択中は不透明、それ以外は半透明
const highlight = (kit, selected) => selected===kit ? state.kitColors[kit] : state.kitColors[kit]+'66';

// 既存のチャートを破棄して作り直す
function makeChart(canvasId, config){
  state.charts[canvasId]?.destroy();
  config.options.animation = state.suppressAnim ? false : undefined;
  return state.charts[canvasId] = new Chart($(canvasId), config);
}

/**
 * 横棒グラフを描く。高さは本数に合わせてキャンバスの親要素に設定する。
 * @param {string} canvasId
 * @param {{labels:string[], data:number[], colors:string[], format?:(v)=>string,
 *          onClick?:(label,index)=>void, detail?:(index)=>string, xTitle?:string}} opt
 *   detail: ツールチップに追加で出す1行 / xTitle: 横軸の見出し
 */
function barChart(canvasId, { labels, data, colors, format = fmtInt, onClick, detail, xTitle }){
  const yAxis=axisStyle({ size:12 });
  yAxis.ticks.autoSkip=false;   // ラベルを間引かず全件表示
  const chart=makeChart(canvasId,{
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor:colors, borderRadius:0, maxBarThickness:30 }] },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ right:56 } },
      onClick: onClick && ((e,els)=>{ if(els.length){ const i=els[0].index; onClick(labels[i], i); } }),
      onHover: onClick && pointerOnHover,
      plugins:{
        legend:{ display:false },
        tooltip:{ ...tooltipStyle(), callbacks:{ label:c=>format(c.raw), afterLabel: detail && (c=>detail(c.dataIndex)) } },
        datalabels:{ anchor:'end', align:'end', clamp:true, color:CHART_THEME.label, font:valueLabelFont(), formatter:format },
      },
      scales:{
        x:{ ...axisStyle(), title: xTitle ? axisTitle(xTitle) : undefined },
        y:yAxis,
      }
    }
  });
  $(canvasId).parentElement.style.height = Math.max(220, labels.length*36+90)+'px';
  chart.resize();
}

// 散布図の基準線（破線）。plugins.refLines:{ x?:number, y?:number } をデータ座標で指定
const refLinePlugin = {
  id:'refLines',
  beforeDatasetsDraw(chart, _args, opts){
    const { ctx, chartArea:a, scales:{ x, y } } = chart;
    ctx.save();
    ctx.strokeStyle='rgba(255,200,87,.35)'; ctx.lineWidth=1; ctx.setLineDash([5,5]);
    if(opts.x!=null){ const px=x.getPixelForValue(opts.x); ctx.beginPath(); ctx.moveTo(px,a.top); ctx.lineTo(px,a.bottom); ctx.stroke(); }
    if(opts.y!=null){ const py=y.getPixelForValue(opts.y); ctx.beginPath(); ctx.moveTo(a.left,py); ctx.lineTo(a.right,py); ctx.stroke(); }
    ctx.restore();
  },
};

/**
 * キットの散布図（縦軸は勝率 0-100 固定、横軸は指定）を描く。
 * @param {string} canvasId
 * @param {{points:{kit:string,x:number,y:number}[], selected:string,
 *          x:{title:string, format:(v)=>string, tick:(v)=>string}, refX?:number, onClick?:(kit)=>void}} opt
 *   refX: 横軸の基準線（破線）の位置。縦軸は勝率 50% に基準線
 */
function scatterChart(canvasId, { points, selected, x:xAxis, refX, onClick }){
  const isSel=p=>p.kit===selected;
  const axis=(title,tick)=>{
    const s=axisStyle();
    return { ...s, ticks:{ ...s.ticks, callback:tick },
             title:axisTitle(title) };
  };
  makeChart(canvasId,{
    type:'scatter',
    data:{ datasets:[{
      data:points,
      pointStyle:'rect',
      pointBackgroundColor:points.map(p=>highlight(p.kit,selected)),
      pointBorderColor:    points.map(p=>isSel(p) ? '#fff' : state.kitColors[p.kit]),
      pointBorderWidth:    points.map(p=>isSel(p) ? 2 : 1),
      pointRadius:         points.map(p=>isSel(p) ? 9 : 7),
      pointHoverRadius:11,
    }] },
    plugins:[refLinePlugin],
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:18, right:28 } },
      onClick: onClick && ((e,els)=>{ if(els.length) onClick(points[els[0].index].kit); }),
      onHover: onClick && pointerOnHover,
      plugins:{
        legend:{ display:false },
        refLines:{ x:refX, y:50 },
        tooltip:{ ...tooltipStyle(), callbacks:{
          title:items=>items[0].raw.kit,
          label:c=>[`${xAxis.title} ${xAxis.format(c.raw.x)}`, `勝率 ${pctFromUnit(c.raw.y)}`],
        } },
        datalabels:{ align:'top', offset:6, clamp:true, font:valueLabelFont(), formatter:v=>v.kit,
                     color:c=>isSel(points[c.dataIndex]) ? CHART_THEME.tooltip.text : CHART_THEME.label },
      },
      scales:{
        x:{ ...axis(xAxis.title, xAxis.tick), beginAtZero:true, grace:'8%' },
        y:{ ...axis('勝率', v=>v+'%'), min:0, max:100 },
      }
    }
  });
}

/* ---------- 6-a. キットタブ ---------- */
function renderKit(){
  const kit=state.kit.current;
  if(!kit) return;
  renderKitTable(kit);
  renderKitHeader(kit);
  renderKitTotals(kit);
  renderKitAbility(kit);
  renderKitSub(kit);
  renderKitCompare(kit);
}

// キット一覧表（見出しクリックでソート列切替。キット名は昇順、数値は降順）
function renderKitTable(kit){
  const ks=state.kitStats;
  const sortKey=state.kit.listSort;
  const pm=k=>ks.perMin(k) ?? -1;   // 時間データなしは末尾へ
  const wr=k=>ks.winRate(k) ?? -1;  // 期間内ピックなしは末尾へ
  const kits = sortKey==='name'
    ? [...ks.kits].sort((a,b)=>a.localeCompare(b,'ja'))
    : [...ks.kits].sort(byDesc({ pickRate:ks.pickRate, winRate:wr, perMin:pm }[sortKey]));
  const maxPick=maxOf(kits.map(ks.pickRate));
  const maxPm=maxOf(kits.map(pm));
  const th=(key,label,cls)=>sortableTh(key,label,sortKey,'sortKitList',cls);

  $('table-kits').innerHTML =
    `<tr>${th('name','キット','')}${th('pickRate','ピック率')}${th('winRate','勝率')}${th('perMin','毎分ダメージ')}</tr>`
    + kits.map(k=>{
        const c=state.kitColors[k];
        const perMinVal=ks.perMin(k);
        return `<tr class="kit-row${k===kit?' selected':''}" data-kit="${esc(k)}" onclick="selectKit(this.dataset.kit)">`
          + `<td>${kitChip(k)}${esc(k)}</td>`
          + barCell(ks.pickRate(k), maxPick, pct(ks.pickRate(k)), c)
          + (ks.winRate(k)!=null ? barCell(ks.winRate(k), 1, pct(ks.winRate(k)), c) : EMPTY_CELL)
          + (perMinVal!=null ? barCell(perMinVal, maxPm, fmtInt(perMinVal), c) : EMPTY_CELL)
          + `</tr>`;
      }).join('');
}

function renderKitHeader(kit){
  $('kit-detail-name').textContent=kit;
  const chip=$('kit-detail-chip');
  chip.style.background = chip.style.color = state.kitColors[kit] || '#888';
}

const kitPicks = kit => state.picks.filter(p=>p.kit===kit);
const kitRows  = kit => state.rows.filter(r=>r.kit===kit);

// 総ピック数・総勝利数（大きく表示）
function renderKitTotals(kit){
  const ks=state.kitStats;
  const card=(k,v,sub)=>`<div class="pstat"><span class="pk">${k}</span><span class="pv">${v}</span><span class="psub">${sub}</span></div>`;
  $('kit-totals').innerHTML =
      card('総ピック数', fmtInt(ks.picks(kit)), 'ピック率 '+pct(ks.pickRate(kit)))

// アビリティ別グラフ（毎分 / 通常攻撃比）
function renderKitAbility(kit){
  const color=state.kitColors[kit];
  const ab=derive.kitAbilities(kitPicks(kit), kitRows(kit));

// 使用プレイヤー / キット相性 / 習熟カーブ（選択中の1つだけ描く）

  matchup:  { title:'キット相性',         hint:'同じ試合に敵・味方としていたキット別の勝率' },
  learning: { title:'習熟カーブ',         hint:'各プレイヤーがこのキットを何回目に使った試合か' },
};
const KIT_SUB_COLLAPSED_TITLE = '使用プレイヤー・キット相性・習熟カーブ';
function renderKitSub(kit){
  const sub=state.kit.sub;
  const open=state.kit.subOpen;
  $('kit-sub-row').classList.toggle('collapsed', !open);
  $('kit-sub-collapse').setAttribute('aria-expanded', open);
  $('kit-sub-body').hidden = !open;
  $('h2-kit-sub').textContent = open ? KIT_SUB[sub].title : KIT_SUB_COLLAPSED_TITLE;

      + players.map(p=>`<tr><td>${esc(disp(p.pid))}</td><td class="num">${p.count}</td>`
                       + `<td class="num">${pct(p.winRate)}</td>${barCell(p.avgDmg,maxAvg)}</tr>`).join('');
  }else if(sub==='matchup'){
    // 敵：勝率の低い TOP5 / 味方：勝率の高い TOP5
    const mu=state.matchups[kit] ?? { enemy:{}, ally:{} };
    $('table-kit-enemy').innerHTML = matchupTable(mu.enemy, 'asc');
    $('table-kit-ally').innerHTML  = matchupTable(mu.ally, 'desc');

    // 非表示のキャンバスはサイズ 0 になるため、表示中のときだけ描く

// 習熟カーブ：毎分ダメージ（棒・右軸）と勝率（折れ線・左軸 0-100%）の複合グラフ
const LEARNING_LINE_COLOR = CHART_THEME.tooltip.text;   // キット色と被らないニュートラル色
function learningChart(canvasId, buckets, color){
  const yLeft=axisStyle(), yRight=axisStyle();

  const maxDmg=maxOf(buckets.map(b=>b.perMin ?? 0));
  makeChart(canvasId,{
    data:{
      labels:buckets.map(b=>[b.label, `${b.n}試合`]),
      datasets:[
        { type:'bar', label:'毎分ダメージ', yAxisID:'yDmg', order:2,
          data:buckets.map(b=>b.perMin),
          backgroundColor:color, maxBarThickness:56 },
        { type:'line', label:'勝率', yAxisID:'yWin', order:1,
          data:buckets.map(b=>b.winRate!=null ? b.winRate*100 : null),
          borderColor:LEARNING_LINE_COLOR, backgroundColor:LEARNING_LINE_COLOR,
          borderWidth:2, pointRadius:5, pointHoverRadius:7, spanGaps:true, tension:0 },
      ],
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:8 } },
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:true, position:'top', align:'end', labels:legendLabels },
        tooltip:{ ...tooltipStyle(), callbacks:{
          title:items=>`${buckets[items[0].dataIndex].label}（${buckets[items[0].dataIndex].n}試合）`,
          label:c=>c.raw==null ? `${c.dataset.label} -`

        } },
        datalabels:{ display:c=>c.dataset.type==='bar' && c.raw!=null && c.raw>=maxDmg*0.15,   // 低すぎる棒には収まらないので出さない

        x:axisStyle(),
        yWin:{ ...yLeft, position:'left', min:0, max:100, title:axisTitle('勝率'),
               ticks:{ ...yLeft.ticks, callback:v=>v+'%' } },
        yDmg:{ ...yRight, position:'right', beginAtZero:true, grace:'10%', title:axisTitle('毎分ダメージ'),
               grid:{ drawOnChartArea:false }, ticks:{ ...yRight.ticks, callback:v=>fmtInt(v) } },
      },
    },

}

// 習熟カーブの区間（何回目の使用か。to が null は上限なし）
const LEARNING_BUCKETS = [
  { label:'1回目',       from:1,  to:1 },
  { label:'2〜3回目',    from:2,  to:3 },
  { label:'4〜6回目',    from:4,  to:6 },
  { label:'7〜10回目',   from:7,  to:10 },
  { label:'11回目以降',  from:11, to:null },
];

// 相性表の HTML。試合数の少ない組み合わせが上位を占めないよう、
// TOP5 が埋まる範囲でできるだけ大きい最低試合数で絞り込む
const MATCHUP_TOP = 5;
const MATCHUP_MIN_GAMES = [5, 3, 2, 1];
function matchupTable(stats, order){
  const all=Object.entries(stats).map(([kit,s])=>({ kit, n:s.n, winRate:s.wins/s.n }));
  const min=MATCHUP_MIN_GAMES.find(m=>all.filter(e=>e.n>=m).length>=MATCHUP_TOP) ?? 1;
  const sign = order==='asc' ? -1 : 1;
  const top=all.filter(e=>e.n>=min)
    .sort((a,b)=>sign*(b.winRate-a.winRate) || b.n-a.n)
    .slice(0, MATCHUP_TOP);
  const head='<tr><th>キット</th><th class="num">試合数</th><th class="num">勝率</th></tr>';
  if(!top.length) return head+'<tr><td class="empty" colspan="3">データなし</td></tr>';
  return head + top.map(e=>`<tr><td>${kitChip(e.kit)}${esc(e.kit)}</td><td class="num">${e.n}</td>`
                          + barCell(e.winRate, 1, pct(e.winRate), state.kitColors[e.kit]) + '</tr>').join('');
}

// 全キット比較（ピック率×勝率 / 毎分ダメージ×勝率 / ダメージソース ランキング）
function renderKitCompare(kit){
  const ks=state.kitStats;
  const view=state.kit.view;
  const isRank = view==='abilityRank';
  $('kit-scatter-box').style.display = isRank ? 'none' : '';
  $('ability-rank-box').style.display = isRank ? '' : 'none';
  $('kit-compare-hint').textContent = isRank ? '' : 'クリックで詳細';

  // 散布図とランキングの枠は同じ高さ（ランキングははみ出た分を縦スクロール）
  const boxHeight=Math.max(360, ks.kits.length*36+90)+'px';
  $('kit-scatter-box').style.height = $('ability-rank-box').style.height = boxHeight;

  // 非表示側のキャンバスはサイズ 0 になるため、表示中のものだけ描く。
  // ランキングはキット選択に依存しないので、未作成のときだけ描く
  if(isRank){
    if(!state.charts['chart-ability-rank']) renderAbilityRanking();
    return;
  }
  const common={ selected:kit, onClick:selectKit };
  if(view==='pickWin'){
    scatterChart('chart-kit-scatter',{ ...common,
      points:ks.kits.filter(k=>ks.winRate(k)!=null)        // 期間内ピックなしは勝率がないので除外
        .map(k=>({ kit:k, x:ks.pickRate(k)*100, y:ks.winRate(k)*100 })),
      x:{ title:'ピック率', format:pctFromUnit, tick:v=>v+'%' },
      refX: ks.kits.length ? 100/ks.kits.length : null,   // 全キット均等に選ばれた場合のピック率
    });
  }else{
    const points=ks.kits.filter(k=>ks.perMin(k)!=null)    // 時間データのないキットは除外
      .map(k=>({ kit:k, x:ks.perMin(k), y:ks.winRate(k)*100 }));
    scatterChart('chart-kit-scatter',{ ...common, points,
      x:{ title:'毎分ダメージ', format:fmtInt, tick:v=>fmtInt(v) },
      refX: points.length ? points.reduce((s,p)=>s+p.x,0)/points.length : null,   // キット平均
    });
  }
}

/* ---------- 6-b. 試合タブ ---------- */
function renderMatch(){
  const id=state.match.current;
  const meta=state.matches.get(id);
  const picks=state.picks.filter(p=>p.matchId===id);
  syncStrip('match-strip', id);

  if(!meta || !picks.length){
    $('table-match-a').innerHTML=$('table-match-b').innerHTML='';
    $('col-team-a').classList.remove('won'); $('col-team-b').classList.remove('won');
    $('match-ability-detail').style.display='none';
    return;
  }

  const m=derive.matchPlayers(picks, state.rows.filter(r=>r.matchId===id));
  state.match.model=m;   // チーム表のクリックから選手を引くため
  const aWon=meta.winTeam==='A';

  barChart('chart-match',{
    labels:m.players.map(p=>p.name),
    data:  m.players.map(p=>p.total),
    colors:m.players.map(p=>TEAM_COLOR[p.team] ?? TEAM_COLOR.B),
    onClick:(label,i)=>renderMatchAbility(m.players[i], meta, id),
  });

  const badge=won=>won ? '<span class="badge badge-win">🏆 WIN</span>' : '<span class="badge badge-lose">LOSE</span>';
  const hint='<span class="click-hint">クリックで詳細</span>';
  $('h2-team-a').innerHTML=`チーム A ${badge(aWon)}${hint}`;
  $('h2-team-b').innerHTML=`チーム B ${badge(!aWon)}${hint}`;
  $('col-team-a').classList.toggle('won',aWon);
  $('col-team-b').classList.toggle('won',!aWon);
  $('table-match-a').innerHTML=teamTable(m.team('A'),'a',id,m.hasKD);
  $('table-match-b').innerHTML=teamTable(m.team('B'),'b',id,m.hasKD);

  // アビリティ詳細：同じ試合で選択済みならそれを維持、なければ1位
  const sel=state.match.selected;
  const target = (sel && sel.matchId===id && m.byPid[sel.pid]) ? m.byPid[sel.pid] : m.players[0];
  renderMatchAbility(target, meta, id);
}

// チームメンバー表（ダメージは下のグラフに任せ、キル・デスとそのキットを何回目に使ったかを出す）
// キル・デスの記録がない試合（hasKD=false）は2列まとめて「記録なし」
function teamTable(players, teamClass, matchId, hasKD){
  const kd = v => `<td class="num">${v ?? ''}</td>`;
  return `<tr><th>プレイヤー — キット</th><th class="num">キル</th><th class="num">デス</th><th class="num">キット使用</th></tr>`
    + players.map(p=>{

// 数直線の描画。ラベルの段組みは横幅に依存するので、幅が変わったら（タブを開いた・画面の大きさが変わった）描き直す
const itemTimeline = {
  data: null,
  LANE: 50,        // 1段の高さ(px)
  GAP: 6,          // 同じ段で隣り合うラベルの最小間隔(px)
  draw(){
    const el=$('match-items-timeline');
    if(!this.data || !el.clientWidth) return;
    const { list, duration }=this.data;
    const width=el.clientWidth-56;                 // 左右の余白（padding 28px×2）を除いた軸の長さ
    const x = t => Math.min(1, t/duration)*width;

    // ラベルの幅を測ってから、軸の上下の段に振り分ける（上1段目 → 下1段目 → 上2段目 …の順に空いている段へ）
    el.innerHTML='<div class="tl-inner"></div>';
    const inner=el.firstChild;
    const labels=list.map(b=>{
      const lb=document.createElement('div');
      lb.className='tl-label';
      lb.innerHTML=`<span class="tl-time">${fmtClock(b.time)}</span>${itemLabel(b.item)}`;
      inner.appendChild(lb);
      return { b, lb, w:lb.offsetWidth, h:lb.offsetHeight };
    });
    const laneEnds=[];                              // 段番号 → その段の右端(px)
    labels.forEach(l=>{
      const cx=x(l.b.time);
      l.left=Math.max(0, Math.min(width-l.w, cx-l.w/2));   // 端では軸からはみ出さないよう寄せる
      let lane=0;
      while(laneEnds[lane]!=null && laneEnds[lane]+this.GAP>l.left) lane++;
      laneEnds[lane]=l.left+l.w;
      l.lane=lane;
    });
    // 段 0,2,4… は軸の上、1,3,5… は軸の下
    const above=labels.filter(l=>l.lane%2===0), below=labels.filter(l=>l.lane%2===1);
    const upLanes=above.length ? Math.max(...above.map(l=>l.lane/2))+1 : 0;
    const downLanes=below.length ? Math.max(...below.map(l=>(l.lane-1)/2))+1 : 0;
    const axisY=upLanes*this.LANE+18;
    const TICK_AREA=22;                             // 軸の下の目盛り数字の分
    inner.style.height=(axisY+TICK_AREA+downLanes*this.LANE+10)+'px';

    let html=`<div class="tl-axis" style="top:${axisY-1}px"></div>`;
    // 目盛り：1分ごと（長い試合は2分ごと）。最後は試合時間
    const step = duration>600 ? 120 : 60;
    for(let t=0; x(t)<width-90; t+=step){          // 右端の「試合時間 試合終了」と重なる目盛りは出さない
      html+=`<div class="tl-tick" style="left:${x(t)}px;top:${axisY}px"></div>`
          + `<div class="tl-tick-label" style="left:${x(t)}px;top:${axisY+7}px">${fmtClock(t)}</div>`;
    }
    html+=`<div class="tl-end-mark" style="left:${width-1}px;top:${axisY-7}px"></div>`
        + `<div class="tl-end" style="left:${width+6}px;top:${axisY+7}px">${fmtClock(duration)}<small>試合終了</small></div>`;
    labels.forEach(l=>{
      const cx=x(l.b.time);
      const up=l.lane%2===0, k=up ? l.lane/2 : (l.lane-1)/2;
      const top = up ? axisY-12-(k+1)*this.LANE+(this.LANE-l.h) : axisY+TICK_AREA+k*this.LANE;
      const stemTop = up ? top+l.h : axisY, stemBottom = up ? axisY : top;
      html+=`<div class="tl-stem" style="left:${cx}px;top:${stemTop}px;height:${stemBottom-stemTop}px"></div>`
          + `<div class="tl-dot" style="left:${cx}px;top:${axisY-4.5}px"></div>`;
      l.lb.style.left=l.left+'px';
      l.lb.style.top=top+'px';
    });
    inner.insertAdjacentHTML('afterbegin', html);
  },
};
new ResizeObserver(()=>itemTimeline.draw()).observe($('match-items-timeline'));

// アイテム一覧表（見出しクリックでソート。アイテム名は昇順、数値は降順、平均購入時刻は早い順）
function renderItemTable(list){
  const sortKey=state.item.sort, upgrade=state.item.kind==='upgrade';
  const sorted = [...list].sort(
      sortKey==='name' ? (a,b)=>itemBaseName(a).localeCompare(itemBaseName(b),'ja')
    : sortKey==='kit'  ? (a,b)=>String(a.kit).localeCompare(String(b.kit),'ja') || b.rate-a.rate   // 同じキット内は購入率順
    : sortKey==='time' ? (a,b)=>(a.avgTime ?? 1e9)-(b.avgTime ?? 1e9)
    : byDesc({
        rate:    i=>i.rate ?? -1,
        contrib: i=>i.contrib ?? -1e9,    // 値の大きい順（値なしは最後）。人数の少ないものは表で薄く表示して区別する
      }[sortKey]));
  const th=(key,label,cls)=>sortableTh(key,label,sortKey,'sortItemList',cls);
  const maxRate=maxOf(sorted.map(i=>i.rate ?? 0));
  const head = `<tr>${th('name','アイテム','')}${upgrade ? th('kit','キット','') : ''}${th('rate','購入率')}${th('contrib','勝率寄与率')}${th('time','平均購入時刻')}`
             + `${upgrade ? '' : '<th>よく買うキット</th>'}</tr>`;
  if(!sorted.length){
    $('table-items').innerHTML = head + `<tr><td class="empty" colspan="5">${state.itemStats?.recordedMatches ? 'この種類の購入記録はありません' : 'この期間には購入記録のある試合がありません'}</td></tr>`;
    return;
  }
  $('table-items').innerHTML = head + sorted.map(i=>
      `<tr class="item-row${i.name===state.item.current?' selected':''}" data-item="${esc(i.name)}" onclick="selectItem(this.dataset.item)">`
    + `<td>${esc(itemBaseName(i))}</td>`
    + (upgrade ? `<td>${kitChip(i.kit)}${esc(i.kit)}</td>` : '')
    + (i.rate==null ? EMPTY_CELL : barCell(i.rate, maxRate, pct(i.rate), i.kit ? state.kitColors[i.kit] : undefined))
    + contribCell(i)
    + (i.avgTime==null ? EMPTY_CELL : `<td class="num">${fmtClock(i.avgTime)}</td>`)
    + (upgrade ? '' : `<td><div class="item-kits">${i.topKits.map(k=>`<span>${kitChip(k)}${esc(k)}</span>`).join('')}</div></td>`)
    + `</tr>`).join('');
}

// 勝率の比較は、どちらかの人数が ITEM_LOW_SAMPLE 未満だと偶然のぶれが大きいので薄く表示する
const ITEM_LOW_SAMPLE = 10;

// 勝率寄与率のセル（プラスは緑・マイナスは赤。どちらかの人数が少ないものは薄く）
const fmtContrib = v => v==null ? '-' : (v>=0?'+':'')+v.toFixed(1)+'pt';
function contribCell(i){
  if(i.contrib==null) return EMPTY_CELL;
  const cls=['num', i.contrib>0 ? 'pos' : i.contrib<0 ? 'neg' : '', i.lowSample ? 'low-sample' : ''].join(' ');
  const tip=`買った人の勝率 ${pct(i.winRate)}（のべ ${i.buyers} 人）／買わなかった人の勝率 ${pct(i.nonWinRate)}（のべ ${i.nonBuyers} 人）`;
  return `<td class="${cls}" title="${esc(tip)}">${fmtContrib(i.contrib)}</td>`;
}

// アップグレードはキット列があるので「◯◯ アップグレード」の「アップグレード」を省いて表示
const itemBaseName = i => i.upgrade ? i.name.replace(/\s+アップグレード/, '') : i.name;

function renderItemDetail(it){
  $('item-detail-name').textContent=it.name;
  // 見出しは 購入率・勝率寄与率・平均購入時刻 の3つだけ。内訳（人数・それぞれの勝率）はマウスを乗せると出す
  // 勝率寄与率 = 買った人の勝率 − 買わなかった人の勝率（同じ母数の中で比べる）
  const diff=it.contrib, low=it.lowSample;
  const winTip = `買った人の勝率 ${it.winRate!=null ? pct(it.winRate) : '-'}（のべ ${it.buyers} 人）／`
               + `買わなかった人の勝率 ${it.nonWinRate!=null ? pct(it.nonWinRate) : '-'}（のべ ${it.nonBuyers} 人）`
               + (low ? '／人数が少ないため参考値' : '');
  const diffCls = [diff>0 ? 'pos' : diff<0 ? 'neg' : '', low ? 'low-sample' : ''].join(' ');
  $('item-detail-sub').innerHTML =
      `<span title="のべ ${it.denom} 人中 ${it.buyers} 人">購入率<b>${it.rate==null ? '-' : pct(it.rate)}</b></span>`
    + `<span title="${esc(winTip)}">勝率寄与率<b class="${diffCls}">${fmtContrib(diff)}</b></span>`
    + `<span>平均購入時刻<b>${fmtClock(it.avgTime)}</b></span>`;
  itemDotStrip.data={ buys:it.buys, avg:it.avgTime, duration:Math.max(state.itemStats.maxDuration, ...it.buys.map(b=>b.time)) };
  itemDotStrip.draw();

  // キット別の購入率（アップグレードは1キット専用なので出さない）
  $('item-kit-section').style.display = it.upgrade ? 'none' : '';
  if(it.upgrade) return;
  const rows=it.byKit;
  barChart('chart-item-kits',{
    labels:rows.map(r=>r.kit),
    data:  rows.map(r=>r.rate*100),
    colors:rows.map(r=>state.kitColors[r.kit]),

    detail:i=>`のべ ${rows[i].picks} 人中 ${rows[i].buyers} 人`,
    xTitle:'購入率',
  });
}

// 購入時刻の分布（0:00〜記録のある試合の最長時間）。横幅に合わせて点を積み直すので、幅が変わったら描き直す
const itemDotStrip = {
  data: null,
  DOT: 11,         // 点の間隔(px)
  draw(){
    const el=$('item-time-dist');
    if(!this.data || !el.clientWidth) return;
    const { buys, avg, duration }=this.data;
    const width=el.clientWidth-56;
    const x = t => Math.min(1, t/duration)*width;
    // 近い点は同じ列にまとめて上に積む
    const cols={};
    const placed=[...buys].sort((a,b)=>a.time-b.time).map(b=>{
      const c=Math.round(x(b.time)/this.DOT);
      const level=cols[c]=(cols[c] ?? -1)+1;
      return { ...b, cx:c*this.DOT, level };
    });
    const maxLevel=Math.max(0, ...placed.map(p=>p.level));
    const axisY=22+(maxLevel+1)*this.DOT+6;
    let html=`<div class="tl-inner" style="height:${axisY+30}px">`
      + `<div class="tl-axis" style="top:${axisY-1}px"></div>`;
    const step = duration>600 ? 120 : 60;
    for(let t=0; x(t)<width-50; t+=step){
      html+=`<div class="tl-tick" style="left:${x(t)}px;top:${axisY}px"></div>`
          + `<div class="tl-tick-label" style="left:${x(t)}px;top:${axisY+7}px">${fmtClock(t)}</div>`;
    }
    html+=`<div class="tl-end-mark" style="left:${width-1}px;top:${axisY-7}px"></div>`
        + `<div class="tl-end" style="left:${width+6}px;top:${axisY+7}px">${fmtClock(duration)}</div>`
        + (avg==null ? `<div class="ds-avg-label" style="left:${width/2}px;top:0">まだ購入されていません</div>`
          : `<div class="ds-avg" style="left:${x(avg)}px;top:14px;height:${axisY-14}px"></div>`
          + `<div class="ds-avg-label" style="left:${x(avg)}px;top:0">平均<b>${fmtClock(avg)}</b></div>`);
    placed.forEach(p=>{
      html+=`<div class="ds-dot" style="left:${p.cx}px;top:${axisY-this.DOT*(p.level+1)}px;background:${state.kitColors[p.kit] ?? '#888'}"`
          + ` title="${esc(disp(p.pid))} — ${esc(p.kit)}  ${fmtClock(p.time)}"></div>`;
    });
    el.innerHTML=html+'</div>';
  },
};
new ResizeObserver(()=>itemDotStrip.draw()).observe($('item-time-dist'));
