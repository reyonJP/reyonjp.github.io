/* ---------- 7. 名前解決（Mojang via Lambda POST） ---------- */
// 統合版（Geyser/Floodgate）のプレイヤーは UUID が 00000000 で始まり、Mojang API では名前を引けない
const isBedrock = uuid => String(uuid).startsWith('00000000');

// ①〜㊿ の丸数字（51以上は (51) のように括弧書き）
function circledNumber(n){
  if(n>=1  && n<=20) return String.fromCharCode(0x2460+n-1);
  if(n>=21 && n<=35) return String.fromCharCode(0x3251+n-21);
  if(n>=36 && n<=50) return String.fromCharCode(0x32B1+n-36);
  return `(${n})`;
}

// 統合版プレイヤーに「統合版プレイヤー①」…を割り当てる（UUID 順なので毎回同じ番号になる）
function assignBedrockNames(uuids){
  uuids.filter(isBedrock).sort()
       .forEach((u,i)=>{ state.names[u]=`統合版プレイヤー${circledNumber(i+1)}`; });
}

async function fetchNames(uuids){
  const res=await fetch(LAMBDA_URL,{ method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ uuids }) });
  if(!res.ok) throw new Error('HTTP '+res.status);
  return (await res.json()).data;
}

// 名前が増えるたびに、表示名を使う箇所だけ描き直す（アニメーションなし）
function applyNames(map){
  Object.assign(state.names,map);
  rerenderQuiet(()=>{
    buildPlayerStrip();
    renderKit(); renderItem(); renderMatch(); renderPlayer();
  });
}

// GET で名前が返らなかった分だけ問い合わせる。
// バッチを同時に投げると Mojang のレート制限に当たるため順番に処理し、取りこぼしは2巡目で再試行
async function loadNames(){
  const uuids=uniq(state.all.picks.map(p=>p.playerId)).filter(u=>!isBedrock(u));   // 統合版は問い合わせない
  const status=$('name-status');
  const unresolved=()=>uuids.filter(u=>!state.names[u]||state.names[u]===u);

  const runBatches=async(list,label)=>{
    for(let i=0;i<list.length;i+=NAME_BATCH){
      status.textContent=`${label} (${Math.min(i+NAME_BATCH,list.length)}/${list.length})`;
      try{ applyNames(await fetchNames(list.slice(i,i+NAME_BATCH))); }
      catch(e){ console.warn('name batch failed:',e); }
    }
  };

  if(unresolved().length) await runBatches(unresolved(),'プレイヤー名を取得中…');
  if(unresolved().length){ await sleep(1200); await runBatches(unresolved(),'プレイヤー名を再取得中…'); }

  const missing=unresolved().length;
  status.textContent = missing ? `${missing}件のプレイヤー名を取得できませんでした` : '';
}

/* ---------- 8. 起動 ---------- */
/* 表示状態の URL 保存（共有リンク・リロード対策）
 * 今のタブで選んでいるものだけを書く。タブはどのキーがあるかで決まる（tab= は書かない）
 *   キットタブ：#kit=カルティスト　試合タブ：#match=19e63642　プレイヤータブ：#player=<UUID>
 *   統計期間が全期間でなければ &from=2026/09/19&to=2026/10/03 を足す
 * 読み込み時は ?match=… のようなクエリでも、#tab=match だけでもよい。値は1つだけでも複数でもよい。
 * # 以降はサーバーに送られないので静的ホスティング（github.io）でも動く。
 * replaceState で書き換えるので、ブラウザの履歴は増えない */
const TAB_KEY = { kit:'kit', item:'item', match:'match', player:'player' };   // タブ → そのタブの選択を表す URL のキー
const encodeQuery = q => q.toString().replace(/%2F/g,'/');

function saveHash(){
  let q;
  if(!state.all){   // 読み込み中はタブだけ書き換え、URL にある他の値は読み込み後のために残す
    q=urlParams();
    q.set('tab', state.tab);
  }else{
    q=new URLSearchParams();
    const id=state[state.tab].current;
    if(id) q.set(TAB_KEY[state.tab], id);
    else   q.set('tab', state.tab);
    const full=fullPeriod();
    if(state.period.from!==full.from || state.period.to!==full.to){   // 全期間なら省略
      q.set('from', state.period.from);
      q.set('to', state.period.to);
    }
  }
  history.replaceState(null, '', location.pathname+'#'+encodeQuery(q));   // ?… のクエリは # 形式にまとめて消す
}

// URL のクエリ（?…）と #… をまとめて読む（同じキーは # 側を優先）
function urlParams(){
  const q=new URLSearchParams(location.search);
  new URLSearchParams(location.hash.slice(1)).forEach((v,k)=>q.set(k,v));
  return q;
}

// URL の値を state に読み込む（データにない値は無視して既定のまま）。タブ以外はデータ読み込み後のみ
// タブは tab= があればそれ、なければ match → player → kit の順に、値のあるキーのタブを開く
function readHash(){
  const q=urlParams();
  const tab = TABS.includes(q.get('tab')) ? q.get('tab') : ['match','player','item','kit'].find(t=>q.has(TAB_KEY[t]));
  if(tab) state.tab=tab;
  if(!state.all) return;
  const kit=q.get('kit'), match=q.get('match'), player=q.get('player');
  if(state.allKits.includes(kit)) state.kit.current=kit;
  if(state.all.matches.has(match)) state.match.current=match;
  if(state.all.picks.some(p=>p.playerId===player)) state.player.current=player;
  const item=q.get('item');
  if(item && state.all.itemNames.has(item)){   // 種類（共通／アップグレード）も合わせる
    state.item.current=item;
    state.item.kind = isUpgradeItem(item) ? 'upgrade' : 'common';
    state.item.kit = null;
  }
  let from=q.get('from'), to=q.get('to');
  if(state.dates.includes(from) && state.dates.includes(to)){
    if(from>to) [from,to]=[to,from];
    state.period={ from, to };
  }else{
    state.period=fullPeriod();
  }
}

// URL の状態を画面に反映（読み込み時と、手で URL を書き換えたとき）
function applyHash(){
  readHash();
  syncPeriodSlider();
  applyPeriod();          // 期間外の選択はここで先頭に切り替わる
  switchTab(state.tab);   // saveHash もここで行われ、無効な値は URL から消える
  renderKit(); renderItem(); renderMatch(); renderPlayer();
  revealCard(state.tab);
}

// 試合カード列（統計期間が変わるたびに作り直す）
function buildMatchStrip(){
  const list=derive.matchList(state.matches, state.picks);
  $('match-strip').innerHTML=list.map(m=>
    `<button type="button" class="card" role="option" data-id="${esc(m.id)}" onclick="selectMatch(this.dataset.id)">`
    + `<div class="mc-date">${esc(m.dateText)}<small>${esc(m.timeText)}</small></div>`
    + `<div class="mc-map">${esc(m.map)}</div>`
    + `<div class="mc-row"><span>人数<b>${m.players}</b></span><span>時間<b>${fmtClock(m.duration)}</b></span></div>`
    + `</button>`).join('');
  return list;
}

// プレイヤーカード列（名前解決で表示名・並び順が変わるため再構築されうる）
function buildPlayerStrip(){
  const list=derive.playerList(state.picks);
  const el=$('player-strip');
  const keepScroll=el.scrollLeft;
  el.innerHTML=list.map(p=>
    `<button type="button" class="card" role="option" data-id="${esc(p.id)}" onclick="selectPlayer(this.dataset.id)">`
    + `<div class="pc-name${p.name===p.id?' uuid':''}" title="${esc(p.name)}">${esc(p.name)}</div>`
    + `<div class="mc-row"><span>試合<b>${p.matches}</b></span><span>勝率<b>${pct(p.winRate)}</b></span></div>`
    + `</button>`).join('');
  el.scrollLeft=keepScroll;
  return list;
}

// カード列をマウス/ペンのドラッグでもスクロールできるようにする（タッチは標準挙動のまま）
function enableDragScroll(el){
  let startX=0, startLeft=0, moved=false, active=false;
  const DRAG_THRESHOLD=6;   // これ未満の移動はクリック扱い

  el.addEventListener('pointerdown', e=>{
    if(e.pointerType==='touch' || e.button!==0) return;
    active=true; moved=false;
    startX=e.clientX; startLeft=el.scrollLeft;
  });
  el.addEventListener('pointermove', e=>{
    if(!active) return;
    const dx=e.clientX-startX;
    if(!moved && Math.abs(dx)>DRAG_THRESHOLD){
      moved=true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
    }
    if(moved) el.scrollLeft=startLeft-dx;
  });
  const end=e=>{
    if(!active) return;
    active=false;
    if(moved){
      // ドラッグ直後の click がカード選択にならないよう1回だけ握りつぶす
      const swallow=ev=>{ ev.stopPropagation(); ev.preventDefault(); };
      el.addEventListener('click', swallow, { capture:true, once:true });
      setTimeout(()=>el.removeEventListener('click', swallow, { capture:true }), 0);
      el.classList.remove('dragging');
      if(el.hasPointerCapture?.(e.pointerId)) el.releasePointerCapture(e.pointerId);
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', ()=>{ if(active && !moved) active=false; });
}

/* 統計期間スライダー
 * 試合のあった日付（state.dates）を等間隔に並べ、左右のつまみで開始・終了を選ぶ。
 * ドラッグ中は表示（日付・範囲・試合数）だけ更新し、離したとき（change）に集計し直す */
// 2つのつまみは追い越し可能。左にある方が開始、右にある方が終了
function periodIndex(){
  const a=+$('period-from').value, b=+$('period-to').value;
  return { from:Math.min(a,b), to:Math.max(a,b) };
}
const railPos = i => state.dates.length>1 ? i/(state.dates.length-1)*100 : 0;   // 0〜100%

function buildPeriodSlider(){
  const max=Math.max(0, state.dates.length-1);
  ['period-from','period-to'].forEach(id=>{ $(id).max=max; $(id).disabled=state.dates.length<2; });
  $('period-rail').insertAdjacentHTML('beforeend',
    state.dates.map((d,i)=>`<span class="range-tick" style="left:${railPos(i)}%"></span>`).join(''));
  syncPeriodSlider();
}

// state.period をスライダーに反映
function syncPeriodSlider(){
  $('period-from').value=Math.max(0, state.dates.indexOf(state.period.from));
  $('period-to').value  =Math.max(0, state.dates.indexOf(state.period.to));
  drawPeriodSlider();
}

// つまみの位置から日付・塗り・目盛り・試合数を描く
function drawPeriodSlider(){
  const { from, to }=periodIndex();
  const fromDate=state.dates[from] ?? '—', toDate=state.dates[to] ?? '—';
  $('period-from-label').textContent=fromDate;
  $('period-to-label').textContent=toDate;
  ['period-from','period-to'].forEach(id=>{
    const v=+$(id).value;
    $(id).setAttribute('aria-label', v===from ? '開始日' : '終了日');
    $(id).setAttribute('aria-valuetext', state.dates[v] ?? '');
  });
  $('period-fill').style.left=railPos(from)+'%';
  $('period-fill').style.right=(100-railPos(to))+'%';
  document.querySelectorAll('#period-rail .range-tick').forEach((t,i)=>t.classList.toggle('on', i>=from && i<=to));
  const n=state.matchDates.filter(d=>d>=fromDate && d<=toDate).length;
  $('period-count').innerHTML=`<b>${n}</b>試合`;
  $('period-reset').disabled = from===0 && to===state.dates.length-1;   // 既に全期間なら押せない
}

// ドラッグ中は表示だけ更新
const onPeriodInput = () => drawPeriodSlider();

function commitPeriod(){
  const { from, to }=periodIndex();
  const period={ from:state.dates[from], to:state.dates[to] };
  if(period.from===state.period.from && period.to===state.period.to) return;
  changePeriod(period);
}

// 期間内の試合だけで state.matches / picks / rows と集計を作り直す
function applyPeriod(){
  const { from, to }=state.period;
  const inPeriod=x=>{ const d=dateOf(x.date); return d>=from && d<=to; };
  const all=state.all;
  state.matches=new Map([...all.matches].filter(([,m])=>inPeriod(m)));
  state.picks=all.picks.filter(inPeriod);
  state.rows=all.rows.filter(inPeriod);
  state.kitStats=derive.kitStats(state.picks, state.rows, state.allKits);
  state.abilityRank=derive.abilityRanking(state.rows);
  state.matchups=derive.kitMatchups(state.picks);
  state.itemStats=derive.itemStats(state.picks);
  state.charts['chart-ability-rank']?.destroy();   // ランキングは未作成のときだけ描くので作り直させる
  delete state.charts['chart-ability-rank'];

  // 選択中のキット・試合・プレイヤーが期間外になったら先頭に切り替える
  const kits=state.kitStats.kits;
  if(!kits.includes(state.kit.current)) state.kit.current=kits[0] ?? null;
  const matchList=buildMatchStrip();
  if(!matchList.some(m=>m.id===state.match.current)) state.match.current=matchList[0]?.id ?? null;
  const playerList=buildPlayerStrip();
  if(!playerList.some(p=>p.id===state.player.current)) state.player.current=playerList[0]?.id ?? null;
  ensureItemSelected();

}

const fullPeriod = () => ({ from:state.dates[0] ?? '', to:state.dates.at(-1) ?? '' });

function changePeriod(period){
  state.period=period;
  syncPeriodSlider();
  applyPeriod();
  saveHash();   // 期間外になった選択が先頭に切り替わるので、その後で保存
  renderKit(); renderItem(); renderMatch(); renderPlayer();
}
const setPeriod   = (side, value) => changePeriod({ ...state.period, [side]:value });
const resetPeriod = () => changePeriod(fullPeriod());

function init(data){
  const all=buildTables(data);
  Object.assign(state.names, data.names);   // Lambda が覚えている名前（最初の描画から名前で出す）
  state.all=all;
  const kits=uniq(all.picks.map(p=>p.kit)).sort();
  let extra=0;
  kits.forEach(k=>{ state.kitColors[k] = KIT_COLOR[k] ?? FALLBACK_KIT_COLORS[extra++ % FALLBACK_KIT_COLORS.length]; });
  state.kitUseNth=derive.kitUseNth(all.picks);
  state.allKits=kits;
  assignBedrockNames(uniq(all.picks.map(p=>p.playerId)));   // 最初の描画から統合版の名前で出す

  // 統計期間：試合のあった日付の全範囲から始める
  state.matchDates=derive.matchList(all.matches, all.picks).map(m=>dateOf(m.dateText));   // 試合数の表示用
  state.dates=uniq(state.matchDates.filter(Boolean)).sort();
  state.period=fullPeriod();
  state.kit.current=kits[0] ?? null;
  buildPeriodSlider();
  enableDragScroll($('match-strip'));
  enableDragScroll($('player-strip'));

  TABS.forEach(t=>{
    $(t+'-skeleton').style.display='none';
    $(t+'-content').style.display='block';
  });
  applyHash();   // URL の状態（なければ既定）で描画
  window.addEventListener('hashchange', applyHash);

  loadNames();
}

// データを待たずに URL のタブを開いておく（読み込み中の表示もそのタブで出る）
readHash();
if(state.tab!=='kit') switchTab(state.tab);

fetch(LAMBDA_URL)
  .then(r=>{ if(!r.ok) throw new Error('サーバーエラー ('+r.status+')'); return r.json(); })
  .then(result=>init(result))
  .catch(e=>{
    TABS.forEach(t=>{ $(t+'-skeleton').innerHTML=`<div class="error">読み込み失敗: ${esc(e.message)}</div>`; });
  });
</script>
