name: Discord通知

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: イベント種別を判定してDiscordに通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          COMMIT_MSG: ${{ github.event.commits[0].message }}
          COMMIT_URL: ${{ github.event.compare }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          if [ "$EVENT" = "push" ]; then
            COLOR=3447003
            TITLE="📦 Push: ${REPO}"
            DESCRIPTION="**${ACTOR}** が \`${REF}\` にプッシュしました

${COMMIT_MSG}"
            URL="${COMMIT_URL}"

          elif [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
            COLOR=5763719
            TITLE="✅ Merge: ${REPO}"
            DESCRIPTION="**${ACTOR}** が PR をマージしました

**${PR_TITLE}**"
            URL="${PR_URL}"

          elif [ "$EVENT" = "pull_request" ]; then
            COLOR=16776960
            TITLE="🔀 Pull Request (${ACTION}): ${REPO}"
            DESCRIPTION="**${ACTOR}** が PR を ${ACTION} しました

**${PR_TITLE}**"
            URL="${PR_URL}"

          elif [ "$EVENT" = "pull_request_review_comment" ] || [ "$EVENT" = "issue_comment" ]; then
            COLOR=15158332
            TITLE="💬 PRコメント: ${REPO}"
            DESCRIPTION="**${ACTOR}** がコメントしました

${COMMENT_BODY}"
            URL="${COMMENT_URL}"

          else
            echo "通知対象外のイベント: $EVENT"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc  "$DESCRIPTION" \
            --arg url   "$URL" \
            --argjson color "$COLOR" \
            '{embeds:[{title:$title, description:$desc, url:$url, color:$color}]}')

          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"